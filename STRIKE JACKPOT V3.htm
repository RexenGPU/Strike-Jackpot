function buildChartSVG(points){
  const w=680,h=230,padL=54,padR=14,padT=16,padB=44,volH=34;
  const vs=points.map(p=>p.v);
  const mn=Math.min(...vs),mx=Math.max(...vs),rg=(mx-mn)||1;
  const X=i=>padL+(i/(points.length-1))*(w-padL-padR);
  const Y=v=>padT+(1-(v-mn)/rg)*(h-padT-padB-volH);
  const line=points.map((p,i)=>`${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const up=vs[vs.length-1]>=vs[0],col=up?'#39c26a':'#ff4d5e';
  const maxVol=Math.max(...points.map(p=>p.vol),1);
  const dstr=t=>new Date(t).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
  const grid=[0,.25,.5,.75,1].map(k=>{
    const v=mn+rg*(1-k);
    return `<line x1="${padL}" y1="${(padT+(h-padT-padB-volH)*k).toFixed(1)}" x2="${w-padR}" y2="${(padT+(h-padT-padB-volH)*k).toFixed(1)}" stroke="#262b36"/>
    <text x="${padL-6}" y="${(padT+(h-padT-padB-volH)*k+4).toFixed(1)}" text-anchor="end" font-family="Chakra Petch" font-size="9" fill="#5b6473">${v>=10000?(v/1000).toFixed(1)+'k':Math.round(v)}</text>`;
  }).join('');
  const xl=[0,Math.floor((points.length-1)/2),points.length-1].map(i=>`<text x="${X(i).toFixed(1)}" y="${h-8}" text-anchor="middle" font-family="Chakra Petch" font-size="9" fill="#5b6473">${dstr(points[i].t)}</text>`).join('');
  const vols=points.map((p,i)=>`<rect x="${(X(i)-2).toFixed(1)}" y="${(h-padB+(volH*(1-p.vol/maxVol))).toFixed(1)}" width="4" height="${(volH*p.vol/maxVol).toFixed(1)}" fill="${col}" opacity=".4"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" data-n="${points.length}">
    ${grid}${xl}${vols}
    <polygon points="${padL},${h-padB-volH} ${line} ${w-padR},${h-padB-volH}" fill="${col}" opacity=".07"/>
    <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${X(points.length-1)}" cy="${Y(vs[vs.length-1])}" r="4" fill="${col}"><animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/></circle>
    <g id="curs" style="display:none">
      <line id="cursx" y1="${padT}" y2="${h-padB}" stroke="#98a1b1" stroke-dasharray="3 4"/>
      <circle id="cursc" r="4.5" fill="#0a0b0e" stroke="${col}" stroke-width="2.4"/>
    </g>
    <rect id="cap" x="${padL}" y="0" width="${w-padL-padR}" height="${h-padB}" fill="transparent"/>
  </svg>`;
}
function mountChart(zoneId,getPoints){
  const zone=document.getElementById(zoneId); if(!zone) return;
  const svg=zone.querySelector('svg'); if(!svg) return;
  const points=getPoints();
  const tip=zone.querySelector('.charttip'),curs=svg.querySelector('#curs');

  const move=(clientX)=>{
    const r=svg.getBoundingClientRect();
    const xr=(clientX-r.left)/r.width*680;
    const padL=54,padR=14,n=points.length;
    const k=Math.max(0,Math.min(1,(xr-padL)/(680-padL-padR)));
    const i=Math.round(k*(n-1));
    const p=points[i],prev=points[Math.max(0,i-1)];
    const d=p.v/prev.v-1;
    curs.style.display='';
    const px=padL+(i/(n-1))*(680-padL-padR);
    cx.setAttribute('x1',px); cx.setAttribute('x2',px);
    const vs=points.map(q=>q.v),mn=Math.min(...vs),mx=Math.max(...vs),rg=(mx-mn)||1;
    const py=16+(1-(p.v-mn)/rg)*(230-16-44-34);
    cc.setAttribute('cx',px); cc.setAttribute('cy',py);
    tip.style.display='block';
    const date=new Date(p.t);
    const isToday=dayKey(date)===dayKey();
    const dtxt=points.length>40?date.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'2-digit'})
      :(isToday?date.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):date.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}));

      <div class="ctr"><span>Variation</span><span class="delta ${d>=0?'up':'down'}">${pct(d)}</span></div>
      <div class="ctr"><span>Volume</span><span>${fmt(p.vol)} échanges</span></div>`;
    const zr=zone.getBoundingClientRect();
    let tx=(r.left-zr.left)+((px/680)*r.width)+12;
    if(tx>zr.width-170) tx-=190;
    tip.style.left=tx+'px';
    tip.style.top='14px';
  };
  const hide=()=>{ tip.style.display='none'; curs.style.display='none'; };
  cap.addEventListener('mousemove',e=>move(e.clientX));
  cap.addEventListener('touchmove',e=>move(e.touches[0].clientX),{passive:true});
  cap.addEventListener('mouseleave',hide);
}

let MK={rmin:'',rmax:'',rar:'all',sort:'pop',q:''};
function genMarket(){
  const rnd=mulberry(S.marketSeed);
  const out=[];
  for(let i=0;i<22;i++){
    const it=ITEMS[rndi(ITEMS.length)];
    const wear=WEARS[Math.floor(rnd()*WEARS.length)];
    const price=Math.round(priceOf(it.id)*wear.mult*(0.85+rnd()*0.6)/10)*10;
    out.push({id:'mk'+i,itemId:it.id,wear:wear.id,price,seller:SELLERS[Math.floor(rnd()*SELLERS.length)],pop:Math.floor(rnd()*100)});
  }
  return out;
}

function resolveListing(lid){
  const p=S.marketPlayer.find(x=>x.lid===lid);

  const it=ITEM[p.itemId];
  toast('Vente conclue !',`${it.weapon} « ${it.skin} » vendu à un acheteur. +${fmt(gain)} CR`,'ok',6000);
  hist('sell',`Vente marché : ${it.weapon} « ${it.skin} »`,'Net après frais, cote recalculée',gain);
  S.stats.soldCount++; missionEvent('sell'); checkBadges(); save();
  if(currentView==='market') render();
}

  sfx.whoosh();
  openGameOverlay(`<div class="gbox" style="max-width:900px;text-align:center">

    document.querySelectorAll('#forgeitems .tile').forEach((c,i)=>setTimeout(()=>{ c.style.transform=`translate(${(2.5-i)*90}px,60px) scale(.4)`; c.style.opacity='0'; },i*90));
    sfx.boom();
  },900);
  setTimeout(()=>{
    burst(innerWidth/2,innerHeight/2-60,RAR[reward.rarity].hex,90,12);
    sfx.rare();
    CT.forEach(u=>{ S.inv=S.inv.filter(i=>i.uid!==u); });
    S.showcase=S.showcase.map(s=>CT.includes(s)?null:s);
    if(!isPrac()){
      grantItem(reward.id,wear,'contrat',{quiet:true});
      S.stats.contracts++; missionEvent('contract'); addXP(60);

    CT=[]; save(); checkBadges();
    document.getElementById('forgemsg').innerHTML=`
      <div class="reveal r-${reward.rarity} show" style="--rr:${RAR[reward.rarity].color};margin:20px 0 0">

        <div class="rw"><span>Cote</span><b>${fmt(Math.round(priceOf(reward.id)*wear.mult))} CR</b></div></div></div>`;
  },2400);
}

function initMissions(){
  const today=dayKey();
  if(!S.missions||S.missions.date!==today){
    const rnd=mulberry([...today].reduce((a,c)=>a+c.charCodeAt(0),7));
    const pool=[...MISSION_POOL],chosen=[];
    for(let i=0;i<3;i++) chosen.push(pool.splice(Math.floor(rnd()*pool.length),1)[0]);
    S.missions={date:today,list:chosen.map(m=>({id:m.id,ev:m.ev,goal:m.goal,raw:m.raw||false,progress:0,claimed:false}))};
    save();
  }
}

/* ============ 12. ACTIONS ============ */
function handleAction(act,args,el){
  switch(act){
    case 'sel-case': sfx.click(); caseSel=args; render(); break;
    case 'open-case': openCase(args,false); break;
    case 'forge-case': { const c=CASE[args],k=fragKeyOf(c);
      if((S.frags[k]||0)>=10){ S.frags[k]-=10; S.freeCases[args]=(S.freeCases[args]||0)+1;
        toast('CASE FORGÉE',c.name+' gratuite assemblée — ouvrez-la !','ok');
        hist('frag',`Case forgée : ${c.name}`,'10 fragments consommés',0);
        sfx.rare(); save(); render(); } break; }
    case 'case-skip': closeGameOverlay(); if(currentView==='cases') render(); break;
    case 'case-close': sfx.click(); closeGameOverlay(); render(); break;
    case 'case-again': sfx.click(); closeGameOverlay(); openCase(args,false); break;
    case 'reward-close': sfx.click(); closeGameOverlay(); break;
    case 'rou-bet': sfx.click(); rouState.bet=args; render(); break;
    case 'rou-chip': { const i=document.getElementById('rouamt'); if(i) i.value=args==='max'?balance():(+i.value||0)+ +args; sfx.click(); break; }
    case 'rou-spin': rouSpin(); break;
    case 'cr-chip': { const i=document.getElementById('cramt'); if(i) i.value=args==='max'?balance():(+i.value||0)+ +args; sfx.click(); break; }
    case 'cr-main': crMain(); break;
    case 'd-chip': { const i=document.getElementById('damt'); if(i) i.value=args==='max'?balance():(+i.value||0)+ +args; sfx.click(); break; }
    case 'd-roll': dRoll(); break;
    case 'pl-mode': sfx.click(); PL.mode=args; PL.balls=[]; render(); break;
    case 'pl-drop': plinkoDrop(false); break;
    case 'pl-auto': if(PL.autoLeft>0){ PL.autoLeft=0; } else { PL.autoLeft=Math.min(+document.getElementById('plauto').value,PL.autoBudget); } plinkoAutoBtn(); sfx.click(); break;
    case 'loan-take': takeLoan(args,null); break;
    case 'loan-collat': loanCollatModal(args); break;
    case 'loan-repay': { const l=S.loans.active.find(x=>x.id===args);
      const v=parseInt((document.getElementById('rp-'+args)||{}).value)||0;
      if(l&&v>0) repayLoan(args,v); else toast('Montant invalide','Indiquez un acompte à rembourser.','warn'); break; }
    case 'loan-repay-all': repayLoan(args,'all'); break;
    case 'inv-cat': sfx.click(); INV.cat=args; render(); break;
    case 'inv-rar': sfx.click(); INV.rar=args; render(); break;
    case 'inv-favf': sfx.click(); INV.favOnly=!INV.favOnly; render(); break;
    case 'inv-cmp': sfx.click(); INV.compare=INV.compare?null:true; INV.cmpSel=[]; render(); break;
    case 'inv-pick': invPick(+args); break;
    case 'inv-item': sfx.click(); invDetail(+args); break;
    case 'inv-close': sfx.click(); document.getElementById('iddrawer')?.remove(); break;
    case 'fav-toggle': { const x=S.inv.find(i=>i.uid===+args); if(x){ x.fav=!x.fav; save(); if(currentView==='inventory') render(); else el.classList.toggle('on'); } sfx.click(); break; }
    case 'sell-item': sellItem(+args); break;
    case 'showcase-toggle': { const u=+args,i=S.showcase.indexOf(u);
      if(i>=0) S.showcase[i]=null; else{ const slot=S.showcase.indexOf(null); if(slot<0){ toast('Showcase plein','Retirez d\'abord un objet.','warn'); break; } S.showcase[slot]=u; }
      save(); sfx.click(); document.getElementById('iddrawer')?.remove(); if(currentView==='inventory') render(); break; }
    case 'sc-pick': scPick(+args); break;
    case 'sc-set': { const [i,u]=args.split('|').map(Number); S.showcase[i]=u; closeModal(); save(); render(); sfx.coin(); break; }
    case 'sc-remove': S.showcase[+args]=null; save(); render(); sfx.click(); break;
    case 'mk-rar': sfx.click(); MK.rar=args; render(); break;
    case 'mk-sort': sfx.click(); MK.sort=args; render(); break;
    case 'mk-refresh': sfx.click(); S.marketSeed=Math.floor(Math.random()*999999); MK.q=document.getElementById('mkq')?.value||''; render(); toast('Annonces actualisées','Les cotes ont bougé entre-temps.','info',2500); break;
    case 'mk-buy': mkBuy(el,args); break;
    case 'mk-list-open': mkListOpen(args); break;
    case 'mk-list-pick': mkListOpen(null); break;
    case 'mk-cancel': mkCancel(args); break;
    case 'ct-toggle': { const u=+args; if(CT.includes(u)) CT=CT.filter(x=>x!==u); else if(CT.length<10) CT.push(u); sfx.click(); render(); break; }
    case 'ct-forge': ctForge(); break;
    case 'coll-sel': sfx.click(); collSel=args; render(); break;
    case 'coll-claim': collClaim(args,el); break;
    case 'claim-mission': claimMission(args); break;
    case 'shop-buy': shopBuy(args,el); break;
    case 'th-set': sfx.click(); S.theme=args; document.documentElement.dataset.theme=args; save(); render(); break;
    case 'bg-set': sfx.click(); S.bgEq=args; save(); render(); break;
    case 'tg-sound': S.settings.sound=!S.settings.sound; save(); syncSideBtns(); render(); break;
    case 'tg-parts': S.settings.particles=!S.settings.particles; save(); syncSideBtns(); render(); break;
    case 'tg-prac': togglePractice(); break;
    case 'exp-save': exportSave(); break;
    case 'imp-save': document.getElementById('impfile').click(); break;
    case 'rst-save': resetSave(); break;
    case 'pf-reroll': S.avatarSeed=Math.floor(Math.random()*99999); save(); sfx.click(); render(); break;
    case 'pf-name': openNameModal(); break;
    case 'pf-title': S.titleEq=args; save(); sfx.click(); render(); break;
    case 'pf-fx': S.fxEq=args||null; save(); sfx.click(); render(); break;
    case 'hf-set': sfx.click(); HF=args; render(); break;
    case 'nf-set': sfx.click(); NF=args; render(); break;
    case 'rk-set': sfx.click(); RK=args; render(); break;
    case 'ch-per': sfx.click(); CH.period=args; render(); break;
    case 'item-open': sfx.click(); goItem(args); break;
    case 'gen-name': { const el2=document.getElementById('pfn')||document.getElementById('frn'); if(el2) el2.value=NAME_A[rndi(NAME_A.length)]+NAME_B[rndi(NAME_B.length)]+rndi(100); sfx.click(); break; }
  }
}
function invPick(u){
  if(!INV.cmpSel.includes(u)) INV.cmpSel.push(u);
  if(INV.cmpSel.length===2){
    const [a,b]=INV.cmpSel.map(x=>S.inv.find(i=>i.uid===x));
    INV.cmpSel=[]; INV.compare=null;
    if(a&&b) compareModal(a,b);
  }
  render();
}
function compareModal(a,b){
  const row=x=>({it:ITEM[x.itemId],w:WEARS.find(v=>v.id===x.wear),val:invVal(x)});
  const A=row(a),B=row(b);
  const cmp=(va,vb)=>va>vb?'up':va<vb?'down':'neu';
  openModal(`<div class="mh"><div class="mt">Comparaison</div><button class="iconbtn" data-action="close-modal">${icon('close')}</button></div>
  <div class="mb">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      ${[A,B].map(R=>`<div class="tile r-${R.it.rarity}" style="--rr:${RAR[R.it.rarity].color};cursor:default">
        <div class="in"><div class="art">${artSVG(R.it)}</div><div class="rbar"></div>
        <div class="meta"><div class="nm">${R.it.weapon} «&nbsp;${R.it.skin}&nbsp;»</div>
        <div class="sub"><span class="rar">${RAR[R.it.rarity].name}</span><span class="prc">${fmt(R.val)} CR</span></div></div></div></div>`).join('')}
    </div>
    ${[['Rareté',RARKEYS.indexOf(A.it.rarity),RARKEYS.indexOf(B.it.rarity)],['Cote',A.val,B.val],['Condition x',A.w.mult,B.w.mult]]
      .map(([l,va,vb])=>`<div class="kv"><span class="k">${l}</span>
      <span class="hdelta ${cmp(va,vb)}">${va}</span><span style="color:var(--txt3)">vs</span><span class="hdelta ${cmp(vb,va)}">${vb}</span></div>`).join('')}
  </div>
  <div class="mf"><button class="btn pri" data-action="close-modal">Fermer</button></div>`);
}
function collClaim(key,el){
  const id=key.slice(0,-2),half=key.endsWith('50');
  const c=COLLECTIONS.find(x=>x.id===id);
  const items=ITEMS.filter(i=>i.coll===c.name&&!i.secret);
  const owned=items.filter(i=>S.inv.some(x=>x.itemId===i.id)).length;
  const pct100=owned/items.length*100;
  if(S.collClaimed.includes(key)||(half&&pct100<50)||(!half&&pct100<100)) return;
  S.collClaimed.push(key);
  if(half){ addCredits(2500); hist('win',`Collection ${c.name} — 50%`,'Prime de progression',2500); toast('Récompense de collection','+2 500 Credits','ok'); }
  else{ addCredits(5000); toast('COLLECTION COMPLETED',`${c.reward} débloqué · +5 000 Credits`,'warn',6000);
        hist('win',`Collection ${c.name} complétée`,c.reward,5000); burstAtEl(el||document.body,'#ffb02e',50); }
  sfx.win(); save(); render();
}
function claimMission(id){
  const m=S.missions.list.find(x=>x.id===id); if(!m||m.claimed) return;
  const def=MISSION_POOL.find(x=>x.id===id);
  if(m.progress<def.goal) return;
  m.claimed=true;
  addCredits(def.cr); addXP(def.xp); sfx.win();
  toast('Mission accomplie',`+${fmt(def.cr)} Credits · +${fmt(def.xp)} XP`,'ok');
  hist('mission',`Mission : ${def.txt}`,'Récompense réclamée',def.cr);
  save(); render();
}
function shopBuy(id,el){
  const s=SHOP.find(x=>x.id===id); if(!s||has(s.id)||S.level<s.minLvl) return;
  if(!spendCredits(s.price)){ sfx.error(); toast('Fonds insuffisants','','bad'); return; }
  S.shopOwned.push(id);
  if(s.cat==='sticker'){
    const it=ITEM[s.apply];
    S.inv.push({uid:uid(),itemId:it.id,wear:'fn',at:Date.now(),fav:false});
  }
  sfx.coin(); burstAtEl(el,'#ff8c1a',24);
  toast('Achat effectué',s.name,'ok');
  hist('buy',`Boutique : ${s.name}`,'',-s.price);
  save(); render();
}
function togglePractice(){
  S.settings.practice=!S.settings.practice;
  document.body.classList.toggle('practice',S.settings.practice);
  syncSideBtns(); updateHeader(); save(); render();
  toast(S.settings.practice?'Mode entraînement activé':'Retour au mode normal',
    S.settings.practice?'Solde démo : 25 000 Credits. Rien n\'est enregistré.':'Votre vrai profil est de retour.','info');
}
function syncSideBtns(){
  document.getElementById('sndbtn').classList.toggle('on',S.settings.sound);
  document.getElementById('ptcbtn').classList.toggle('on',S.settings.practice);
}
document.getElementById('sndbtn').addEventListener('click',()=>{ S.settings.sound=!S.settings.sound; save(); syncSideBtns(); sfx.click(); });
document.getElementById('ptcbtn').addEventListener('click',togglePractice);
function exportSave(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='strike-jackpot-sauvegarde.json'; a.click(); URL.revokeObjectURL(a.href);
  toast('Sauvegarde exportée','Fichier JSON téléchargé (marché + prêts inclus).','ok');
}
function resetSave(){
  confirmModal('Réinitialiser la progression',
   `<div style="color:var(--txt2)">Toute votre progression (objets, marché simulé, prêts, Credit Score, historique) sera <b style="color:var(--bad)">définitivement effacée</b> de ce navigateur.</div>`,
   'Tout effacer', ()=>{ localStorage.removeItem(SAVE_KEY); location.hash=''; location.reload(); },'danger');
}
function openNameModal(){
  openModal(`<div class="mh"><div class="mt">Changer de pseudo</div><button class="iconbtn" data-action="close-modal">${icon('close')}</button></div>
  <div class="mb">
    <div class="tfield">${icon('user',16)}<input id="pfn" value="${esc(S.name)}" maxlength="20"></div>
    <button class="btn sm" style="margin-top:12px" data-action="gen-name">${icon('refresh',14)} Générer un pseudo</button>
  </div>
  <div class="mf"><button class="btn" data-action="close-modal">Annuler</button>
  <button class="btn pri" id="pfnok">Enregistrer</button></div>`);
  document.getElementById('pfnok').addEventListener('click',()=>{
    const v=document.getElementById('pfn').value.trim();
    if(v.length>=2){ S.name=v; save(); updateHeader(); toast('Pseudo mis à jour',v,'ok'); }
    closeModal(); render();
  });
}

/* ============ 13. BOOT ============ */
const KONAMI=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let kseq=[];
addEventListener('keydown',e=>{
  kseq.push(e.key); kseq=kseq.slice(-10);
  if(kseq.join(',')===KONAMI.join(',')&&!S.secret){
    S.secret=true;
    grantItem('ghostkonami',WEARS[0],'secret',{quiet:true});
    addCredits(10000); S.badges.push('lucky'); save();
    sfx.rare(); burst(innerWidth/2,innerHeight/2,'#ff2e3f',120,13);
    openModal(`<div class="mh"><div class="mt">Protocole fantôme</div></div>
    <div class="mb"><div class="lvlbox">
      <div class="lb1" style="color:var(--r-mythic)">Signal intercepté</div>
      <div class="lb2" style="font-size:34px">GHOST PROTOCOL</div>
      <div class="lb3">Une lame interdite rejoint votre inventaire, accompagnée de 10 000 Credits fictifs.</div>
    </div></div>
    <div class="mf"><button class="btn pri" data-action="close-modal">Bien reçu</button></div>`);
    hist('egg','Protocole fantôme activé','Récompense secrète',10000);
  }
});
function firstRunModal(){
  openModal(`<div class="mh"><div class="mt">Création du profil</div></div>
  <div class="mb">
    <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
      <div id="frav" style="width:96px;height:96px;border:1px solid var(--line2)">${avatarSVG(S.avatarSeed,S.avatarEmblem)}</div>
      <div style="flex:1;min-width:220px">
        <div class="anno" style="margin-bottom:6px">Pseudo d'opérateur</div>
        <div class="tfield">${icon('user',16)}<input id="frn" value="${esc(S.name)}" maxlength="20"></div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn sm" data-action="gen-name">${icon('refresh',13)} Générer</button>
          <button class="btn sm" id="fravb">${icon('refresh',13)} Avatar</button>
        </div>
      </div>
    </div>
    <div style="margin-top:18px;color:var(--txt2)">Kit de bienvenue : <b style="color:var(--accent2)">2 500 Credits</b> fictifs
    et <b style="color:var(--accent2)">1 Starter Case gratuite</b>. Tout ce que vous verrez ici — Credits, skins, cotes, prêts — est purement virtuel. Bon jeu.</div>
  </div>
  <div class="mf"><button class="btn pri big" id="frok">Entrer dans l'arène</button></div>`);
  document.getElementById('fravb').addEventListener('click',()=>{
    S.avatarSeed=Math.floor(Math.random()*99999);
    document.getElementById('frav').innerHTML=avatarSVG(S.avatarSeed,S.avatarEmblem); sfx.click();
  });
  document.getElementById('frok').addEventListener('click',()=>{
    const v=document.getElementById('frn').value.trim(); if(v.length>=2) S.name=v;
    S.firstRun=false;
    S.freeCases.starter=1;
    hist('sys','Kit de bienvenue reçu','2 500 CR + 1 Starter Case gratuite',2500);
    save(); closeModal(); updateHeader();
    go('cases');
    toast('Bienvenue, '+S.name,'Votre Starter Case gratuite vous attend — cliquez sur OUVRIR.','ok',7000);
    sfx.win();
  });
}
const LMSGS=['Initialisation des systèmes tactiques…','Calibrage des 10 conteneurs…','Génération des skins virtuels…','Reconstitution de 190 jours de cotes…','Ouverture de la banque virtuelle…','Vérification : 0 argent réel détecté…'];
let lp=0;
const lint=setInterval(()=>{
  lp+=8+Math.random()*14;
  document.getElementById('lbar').style.width=Math.min(100,lp)+'%';
  document.getElementById('lmsg').textContent=LMSGS[Math.min(LMSGS.length-1,Math.floor(lp/17))];
  if(lp>=100){ clearInterval(lint); setTimeout(boot,300); }
},140);
function boot(){
  const loaded=load();
  S=loaded||defaultState();
  if(!S.econ) initEcon();
  if(!S.stats.plinko) S.stats.plinko={drops:0,items:0,best:0};
  if(!S.loans) S.loans={active:[],history:[],score:750,cd:0};
  if(!S.frags){ S.frags={}; FRAG_KEYS.forEach(k=>S.frags[k]=0); }
  if(!S.freeCases) S.freeCases={};
  if(!S.guar) S.guar={idx:0,extra:0};
  initMissions();
  const today=dayKey();
  if(S.lastLogin!==today){
    const y=new Date(); y.setDate(y.getDate()-1);
    S.streak=(S.lastLogin===dayKey(y))?S.streak+1:1;
    S.lastLogin=today;
    const bonus=250*Math.min(S.streak,7);
    addCredits(bonus,true);
    setTimeout(()=>toast('Série de '+S.streak+' jour'+(S.streak>1?'s':''),`Bonus quotidien : +${fmt(bonus)} Credits fictifs`,'warn',5000),900);
    hist('sys','Connexion — série '+S.streak+' jour(s)','Bonus quotidien',bonus);
  }
  S.marketPlayer.filter(p=>p.status==='online'&&Date.now()-p.ts>5*60000).forEach(p=>{
    const fair=priceOf(p.itemId)*WEARS.find(w=>w.id===p.wear).mult*1.45;
    if(p.price<=fair){ p.status='sold'; addCredits(Math.round(p.price*0.95),true);
      hist('sell',`Vente marché (hors-ligne) : ${ITEM[p.itemId].weapon}`,`Prix ${fmt(p.price)} CR`,Math.round(p.price*.95)); }
  });
  loansTick();
  save();
  document.documentElement.dataset.theme=S.theme;
  document.body.classList.toggle('practice',S.settings.practice);
  buildNav(); syncSideBtns(); updateHeader();
  const h=location.hash.replace('#/','');
  if(h.startsWith('item/')&&ITEM[h.slice(5)]){ ITEM_SEL=h.slice(5); currentView='itemdetail'; }
  else if(NAV.some(n=>n.id===h)) currentView=h;
  render(); updateNav();
  document.getElementById('loader').classList.add('done');
  document.getElementById('app').classList.add('ready');
  bgLoop(); fxLoop(); econStart();
  if(S.firstRun) firstRunModal();
  setInterval(()=>{ if(currentView!=='crash') crashCleanup(); },2000);
}
</script>
