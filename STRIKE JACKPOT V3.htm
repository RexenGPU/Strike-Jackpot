<!DOCTYPE html>
<html lang="fr" data-theme="blacksite">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>STRIKE JACKPOT — Simulation de tir, collection &amp; économie virtuelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   STRIKE JACKPOT v3 — style.css (extractible : tout ce bloc)
   ================================================================ */
:root{
  --bg:#0a0b0e; --bg2:#0e1015; --panel:#13151b; --panel2:#191c24; --panel3:#1f232e;
  --line:#262b36; --line2:#39404f;
  --txt:#e9ecf2; --txt2:#98a1b1; --txt3:#5b6473;
  --accent:#ff3b30; --accent2:#ff8c1a; --accent-soft:rgba(255,59,48,.14);
  --ok:#39c26a; --warn:#ffb02e; --bad:#ff4d5e;
  --r-common:#8d95a1; --r-uncommon:#3fa34d; --r-rare:#3a8fd9; --r-epic:#a05cf0;
  --r-legendary:#ff7a1a; --r-mythic:#ff2e3f;
  --font-d:'Chakra Petch',sans-serif; --font-b:'Rajdhani',sans-serif;
}
html[data-theme="arctic"]{ --accent:#3fa9ff; --accent2:#9fe0ff; --accent-soft:rgba(63,169,255,.14); }
html[data-theme="neon"]{ --accent:#00e5ff; --accent2:#ff2ee6; --accent-soft:rgba(0,229,255,.13); }
html[data-theme="ember"]{ --accent:#ff6a00; --accent2:#ffd12e; --accent-soft:rgba(255,106,0,.15); }
html[data-theme="ghost"]{ --accent:#b7f02e; --accent2:#2effc4; --accent-soft:rgba(183,240,46,.12); }

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:var(--font-b);font-size:17px;line-height:1.45;overflow-x:hidden;min-height:100vh;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--line2);border:2px solid var(--bg2)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,select{font-family:inherit;font-size:inherit;color:var(--txt)}
svg{display:block}.ic{flex:none}
#bgfx,#fx{position:fixed;inset:0;pointer-events:none;z-index:0}#fx{z-index:200}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 180px 40px rgba(0,0,0,.75)}

#loader{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .6s,visibility .6s}
#loader.done{opacity:0;visibility:hidden}
#loader .lg1{font-family:var(--font-d);font-weight:700;font-size:clamp(34px,6vw,64px);letter-spacing:.14em;text-transform:uppercase}
#loader .lg1 b{color:var(--accent)}
#loader .lg2{font-family:var(--font-d);font-size:12px;letter-spacing:.42em;color:var(--txt3);text-transform:uppercase}
#loader .bar{width:min(360px,72vw);height:3px;background:var(--line);position:relative;overflow:hidden}
#loader .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);transition:width .25s}
#loader .msg{font-size:13px;color:var(--txt3);letter-spacing:.2em;text-transform:uppercase;font-family:var(--font-d)}
#loader .legal{position:absolute;bottom:26px;font-size:12px;color:var(--txt3);letter-spacing:.12em;text-transform:uppercase}

#app{display:none;min-height:100vh;position:relative;z-index:2}#app.ready{display:flex}
#side{width:236px;flex:none;background:rgba(15,17,22,.92);backdrop-filter:blur(12px);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:50}
#side .brand{padding:22px 18px 14px;border-bottom:1px solid var(--line)}
#side .brand .b1{font-family:var(--font-d);font-weight:700;font-size:19px;letter-spacing:.08em}
#side .brand .b1 b{color:var(--accent)}
#side .brand .b2{font-family:var(--font-d);font-size:9px;letter-spacing:.34em;color:var(--txt3);text-transform:uppercase;margin-top:2px}
#side nav{flex:1;overflow-y:auto;padding:12px 0 20px}
.navgrp{font-family:var(--font-d);font-size:10px;letter-spacing:.3em;color:var(--txt3);text-transform:uppercase;padding:16px 18px 8px}
.navlink{display:flex;align-items:center;gap:11px;width:100%;padding:9px 18px;color:var(--txt2);font-family:var(--font-d);font-weight:600;font-size:13.5px;letter-spacing:.09em;text-transform:uppercase;border-left:2px solid transparent;transition:color .15s,background .15s,border-color .15s}
.navlink:hover{color:var(--txt);background:rgba(255,255,255,.03)}
.navlink.active{color:var(--txt);border-left-color:var(--accent);background:var(--accent-soft)}
.navlink .nsub{margin-left:auto;font-size:10px;color:var(--txt3);font-weight:500}
#side .sidefoot{padding:14px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sidebtn{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt2);padding:7px 4px;transition:color .15s}
.sidebtn:hover{color:var(--txt)}
.sidebtn .sw{margin-left:auto;width:32px;height:16px;background:var(--line);border:1px solid var(--line2);position:relative;flex:none;transition:.2s}
.sidebtn .sw::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;background:var(--txt3);transition:.2s}
.sidebtn.on .sw{background:var(--accent-soft);border-color:var(--accent)}
.sidebtn.on .sw::after{left:18px;background:var(--accent)}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;padding:10px 26px;background:rgba(10,11,14,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#top .burger{display:none}
.hstat .lab{font-family:var(--font-d);font-size:9px;letter-spacing:.24em;color:var(--txt3);text-transform:uppercase}
.hstat .val{font-family:var(--font-d);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
#top .balance .val{color:var(--accent2)}
#top .streak .val{color:var(--warn)}
.cur{display:inline-block;width:8px;height:8px;background:var(--accent2);transform:rotate(45deg);margin:0 2px 1px}
.xpwrap{flex:1;max-width:320px;display:flex;flex-direction:column;gap:3px}
.xpbar{height:4px;background:var(--line);position:relative}
.xpbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);transition:width .5s}
.pracbadge{font-family:var(--font-d);font-size:10px;letter-spacing:.2em;padding:4px 10px;background:var(--warn);color:#131313;font-weight:700;display:none;text-transform:uppercase}
body.practice .pracbadge{display:block}
#top .me{display:flex;align-items:center;gap:10px;cursor:pointer}
#top .me .pav{width:34px;height:34px;border:1px solid var(--line2)}
#top .me .pn{font-family:var(--font-d);font-weight:600;font-size:13px;letter-spacing:.05em}
#top .me .pl{font-size:11px;color:var(--txt3)}
#view{flex:1;padding:26px;max-width:1460px;width:100%;margin:0 auto}
#bottom{display:none}

.cut{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.panel{background:var(--panel);border:1px solid var(--line);position:relative}
.panel .ph{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-family:var(--font-d);font-weight:600;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--txt2)}
.panel .ph .dot{width:6px;height:6px;background:var(--accent);flex:none}
.panel .pb{padding:16px}
.ptitle{font-family:var(--font-d);font-weight:700;font-size:clamp(19px,2.4vw,26px);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.ptitle .sub{font-family:var(--font-d);font-weight:500;font-size:11px;letter-spacing:.3em;color:var(--txt3)}
.anno{font-family:var(--font-d);font-size:10px;letter-spacing:.28em;color:var(--txt3);text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:var(--font-d);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:11px 22px;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);transition:transform .12s,border-color .15s,background .15s;user-select:none}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.38;pointer-events:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.pri:hover{filter:brightness(1.12)}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.sm{padding:7px 14px;font-size:11.5px}
.btn.big{padding:15px 34px;font-size:15px}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-d);font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--line2);color:var(--txt2)}
.tfield{display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--line);padding:9px 13px;transition:border-color .15s}
.tfield:focus-within{border-color:var(--accent)}
.tfield input,.tfield select{background:none;border:none;outline:none;flex:1;min-width:0;font-family:var(--font-b);font-weight:600;font-size:15px;color:var(--txt)}
.tfield select option{background:var(--panel)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .sg{font-family:var(--font-d);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--line);color:var(--txt2);background:var(--bg2);transition:.15s}
.seg .sg:hover{border-color:var(--line2);color:var(--txt)}
.seg .sg.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.tile{--rr:var(--r-common);position:relative;background:var(--rr);padding:2px;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);transition:transform .15s}
.tile .in{background:var(--panel);height:100%;display:flex;flex-direction:column;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.tile:hover{transform:translateY(-3px)}
.tile.r-epic:hover .in,.tile.r-legendary:hover .in,.tile.r-mythic:hover .in{box-shadow:inset 0 0 44px -14px var(--rr)}
.tile.r-legendary,.tile.r-mythic{box-shadow:0 0 18px -6px var(--rr)}
.tile .art{padding:14px 12px 6px;display:flex;justify-content:center;position:relative}
.tile .art svg{width:100%;height:auto;max-height:96px}
.tile .rbar{height:3px;background:var(--rr);flex:none}
.tile .meta{padding:9px 11px 11px;border-top:1px solid var(--line)}
.tile .nm{font-family:var(--font-d);font-weight:600;font-size:12.5px;letter-spacing:.03em;line-height:1.25;min-height:32px}
.tile .sub{display:flex;justify-content:space-between;align-items:center;margin-top:5px}
.tile .rar{font-family:var(--font-d);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--rr)}
.tile .prc{font-family:var(--font-d);font-weight:700;font-size:12.5px;color:var(--txt2);font-variant-numeric:tabular-nums}
.tile .favs{position:absolute;top:8px;right:8px;z-index:3;color:var(--txt3);opacity:0;transition:.15s}
.tile:hover .favs{opacity:1}
.tile .favs.on{opacity:1;color:var(--warn)}
.tile.sel{outline:2px solid var(--accent);outline-offset:2px}
.tile.dim .in{filter:grayscale(.9) brightness(.55)}
.tile .locko{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--txt2);background:rgba(10,11,14,.45);z-index:2}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(172px,1fr))}
.empty{padding:44px 20px;text-align:center;color:var(--txt3);font-family:var(--font-d);letter-spacing:.2em;text-transform:uppercase;font-size:12px}
.ttag{position:absolute;top:7px;left:7px;z-index:3;display:flex;align-items:center;gap:4px;font-family:var(--font-d);font-size:8.5px;font-weight:700;letter-spacing:.14em;padding:2px 6px;background:rgba(10,11,14,.82);border:1px solid currentColor}
.ttag.hot{color:var(--accent2)}.ttag.trending{color:var(--warn)}.ttag.rising{color:var(--ok)}
.ttag.falling{color:var(--bad)}.ttag.rare{color:var(--r-epic)}.ttag.legendary{color:var(--r-legendary)}
.delta{font-family:var(--font-d);font-weight:700;font-variant-numeric:tabular-nums}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}.delta.neu{color:var(--txt3)}

.gover{position:fixed;inset:0;z-index:300;background:rgba(8,9,12,.9);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s}
.gover.open{opacity:1;pointer-events:auto}
.gover .gbox{width:min(1100px,96vw)}
.gover .ghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.gover .gtitle{font-family:var(--font-d);font-weight:700;font-size:16px;letter-spacing:.26em;text-transform:uppercase}
.gover .gtitle b{color:var(--accent)}
.iconbtn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--line2);color:var(--txt2);transition:.15s}
.iconbtn:hover{border-color:var(--accent);color:var(--txt)}

.band{position:relative;overflow:hidden;background:var(--bg2);border:1px solid var(--line);height:150px}
.band .track{display:flex;height:100%;will-change:transform}
.bcell{flex:none;width:150px;height:100%;border-right:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.bcell svg{width:100%;height:74px}
.bcell .bn{font-family:var(--font-d);font-size:9.5px;letter-spacing:.1em;color:var(--txt3);text-transform:uppercase;text-align:center;line-height:1.2;overflow:hidden}
.bcell .br{font-family:var(--font-d);font-size:8.5px;letter-spacing:.24em;text-transform:uppercase}
.band .marker{position:absolute;left:50%;top:0;bottom:0;transform:translateX(-50%);z-index:5;pointer-events:none}
.band .marker::before{content:'';position:absolute;top:0;bottom:0;width:2px;background:var(--accent);left:50%;transform:translateX(-50%);box-shadow:0 0 12px var(--accent)}
.band .marker::after{content:'';position:absolute;top:-2px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--accent)}
.band .gl{position:absolute;top:0;bottom:0;width:90px;z-index:4;pointer-events:none}
.band .gl.l{left:0;background:linear-gradient(90deg,var(--bg2),transparent)}
.band .gl.r{right:0;background:linear-gradient(-90deg,var(--bg2),transparent)}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
.shake{animation:shake .45s}
.reveal{--rr:var(--r-common);display:none;align-items:center;gap:26px;padding:26px;background:var(--panel);border:1px solid var(--rr);position:relative;margin-top:20px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.reveal.show{display:flex}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.reveal .rvart{flex:1;min-width:0;display:flex;justify-content:center;padding:10px}
.reveal .rvart svg{width:100%;max-width:480px;max-height:180px;filter:drop-shadow(0 8px 22px rgba(0,0,0,.6))}
.reveal .rinfo{flex:none;width:280px;max-width:44%}
.reveal .rrar{font-family:var(--font-d);font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--rr);font-weight:700}
.reveal .rnm{font-family:var(--font-d);font-weight:700;font-size:22px;line-height:1.2;margin:6px 0 10px}
.reveal .rw{font-size:14px;color:var(--txt2);display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.reveal .rw b{color:var(--txt);font-variant-numeric:tabular-nums}
.reveal .rbtns{display:flex;gap:10px;margin-top:16px}
@keyframes rarpulse{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 34px -6px var(--rr)}}
.reveal.r-mythic,.reveal.r-legendary{animation:pop .45s cubic-bezier(.2,1.6,.4,1),rarpulse 2s .5s infinite}

.rcells{position:relative;overflow:hidden;height:76px;background:var(--bg2);border:1px solid var(--line)}
.rcells .track{display:flex;height:100%;will-change:transform}
.rcell{flex:none;width:74px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;border-right:1px solid rgba(0,0,0,.35)}
.rcell .rm{font-size:15px}.rcell .rc{font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.rcell.red{background:#7a1c17;color:#ffb3ad}.rcell.red .rm{color:#ff6a5e}
.rcell.black{background:#15171c;color:#9aa3b2}
.rcell.blue{background:#12375c;color:#a8d4ff}.rcell.blue .rm{color:#4db8ff}
.rcell.gold{background:#6b4a0a;color:#ffe1a1}.rcell.gold .rm{color:var(--warn)}
.rcells .marker{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--accent);transform:translateX(-50%);z-index:5;box-shadow:0 0 14px var(--accent)}
.rhist{display:flex;gap:7px;flex-wrap:wrap}
.rhist .h{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;font-size:10px;border:1px solid var(--line2)}
.rhist .h.red{background:#7a1c17;color:#ff8d84}.rhist .h.black{background:#15171c;color:#9aa3b2}
.rhist .h.blue{background:#12375c;color:#7cc0ff}.rhist .h.gold{background:#6b4a0a;color:var(--warn)}
.betrow{display:flex;gap:10px;flex-wrap:wrap}
.betopt{flex:1;min-width:120px;padding:12px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;transition:.15s;text-align:center}
.betopt:hover{border-color:var(--line2)}
.betopt.on{border-color:var(--accent);background:var(--accent-soft)}
.betopt .bc{font-family:var(--font-d);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.betopt .bo{font-size:12px;color:var(--txt3);margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--font-d);font-weight:600;font-size:12px;padding:6px 13px;border:1px solid var(--line2);color:var(--txt2);transition:.15s;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--accent);color:var(--txt)}
.bigmult{font-family:var(--font-d);font-weight:700;font-size:clamp(38px,7vw,74px);font-variant-numeric:tabular-nums;line-height:1;text-align:center;letter-spacing:.02em}

#ccv{width:100%;height:300px;display:block;background:var(--bg2);border:1px solid var(--line)}
.crashwrap{position:relative}
.crashstate{position:absolute;top:12px;left:14px;font-family:var(--font-d);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--txt3)}
.crashmult{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.crashmult .m{font-family:var(--font-d);font-weight:700;font-size:clamp(40px,6vw,66px);font-variant-numeric:tabular-nums;text-shadow:0 4px 24px rgba(0,0,0,.7)}
.crashmult .s{font-family:var(--font-d);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--txt2);margin-top:4px}
.crashed .m{color:var(--bad)}

.dscene{width:150px;height:150px;perspective:600px;margin:0 auto}
.dcube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.2,.9,.3,1)}
.dface{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;font-size:56px;color:var(--accent2)}
.dicebig{font-family:var(--font-d);font-weight:700;font-size:clamp(44px,7vw,80px);text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.dicewin{color:var(--ok)}.dicelose{color:var(--bad)}
.dslider{-webkit-appearance:none;width:100%;height:5px;background:var(--line);outline:none;margin:14px 0}
.dslider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:26px;background:var(--accent);cursor:grab;border:none}
.dslider::-moz-range-thumb{width:20px;height:26px;background:var(--accent);cursor:grab;border:none}

.plklayout{display:grid;grid-template-columns:330px 1fr;gap:18px}
#plcv{width:100%;height:520px;display:block;background:var(--bg2);border:1px solid var(--line)}
.plkhist{display:flex;gap:7px;flex-wrap:wrap;min-height:28px}
.plkhist .h{min-width:52px;padding:4px 7px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;font-size:11px;border:1px solid var(--line2);font-variant-numeric:tabular-nums}
.pltable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.pltable th{font-family:var(--font-d);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt3);text-align:right;padding:5px 4px;border-bottom:1px solid var(--line)}
.pltable th:first-child{text-align:left}
.pltable td{padding:4px;font-family:var(--font-d);font-weight:600;font-size:12.5px;text-align:right;border-bottom:1px solid var(--line)}
.pltable td:first-child{text-align:left;font-family:var(--font-b)}
.plmode{display:flex;gap:10px;flex-direction:column}
.plmode .pm{border:1px solid var(--line);background:var(--bg2);padding:12px 14px;cursor:pointer;transition:.15s}
.plmode .pm:hover{border-color:var(--line2)}
.plmode .pm.on{border-color:var(--accent);background:var(--accent-soft)}
.plmode .pm .n{font-family:var(--font-d);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.plmode .pm .d{font-size:12.5px;color:var(--txt3)}
.autoline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.autoline select{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:7px 10px;font-family:var(--font-d);font-size:12px}

.chartzone{position:relative;background:var(--bg2);border:1px solid var(--line)}
.chartzone svg{width:100%;height:auto;display:block}
.charttip{position:absolute;pointer-events:none;background:var(--panel3);border:1px solid var(--line2);padding:8px 12px;font-size:13px;min-width:150px;display:none;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.charttip .ctd{color:var(--txt3);font-family:var(--font-d);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.charttip .ctv{font-family:var(--font-d);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.charttip .ctr{display:flex;justify-content:space-between;gap:14px;color:var(--txt2)}
.bigval{font-family:var(--font-d);font-weight:700;font-size:clamp(30px,4.5vw,52px);font-variant-numeric:tabular-nums;line-height:1.05}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.statgrid .st{background:var(--panel);padding:15px 16px}
.statgrid .st .k{font-family:var(--font-d);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--txt3)}
.statgrid .st .v{font-family:var(--font-d);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;margin-top:3px}
.statgrid .st .v.acc{color:var(--accent2)}
.statgrid .st .v.warn{color:var(--warn)}
.statgrid .st .v.ok{color:var(--ok)}
.hrow{display:flex;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid var(--line)}
.hrow .hic{width:34px;height:34px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--txt2);flex:none}
.hrow .htx{flex:1;min-width:0}
.hrow .htx .l1{font-weight:600;font-size:15px}
.hrow .htx .l2{font-size:12.5px;color:var(--txt3)}
.hrow .hdelta{font-family:var(--font-d);font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.hdelta.up{color:var(--ok)}.hdelta.down{color:var(--bad)}.hdelta.neu{color:var(--txt2)}

.newscard{display:flex;gap:16px;padding:16px;border:1px solid var(--line);background:var(--panel);margin-bottom:12px}
.newscard .nic{width:42px;height:42px;border:1px solid;display:flex;align-items:center;justify-content:center;flex:none}
.newscard.bull .nic{color:var(--ok);border-color:var(--ok)}
.newscard.bear .nic{color:var(--bad);border-color:var(--bad)}
.newscard.neu .nic{color:var(--txt2);border-color:var(--line2)}
.newscard .nt{font-family:var(--font-d);font-weight:700;font-size:15.5px;letter-spacing:.03em}
.newscard .nb{color:var(--txt2);margin-top:3px;font-size:15px}
.newscard .nm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.newscard.actif{border-color:var(--accent2)}
.spark{flex:none}

.rankrow{display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.rankrow:hover{background:var(--bg2)}
.rankrow .rk{font-family:var(--font-d);font-weight:700;color:var(--txt3);width:30px;flex:none}
.rankrow .rn{flex:1;min-width:0}
.rankrow .rn .n1{font-family:var(--font-d);font-weight:600;font-size:14.5px}
.rankrow .rn .n2{font-size:12.5px;color:var(--txt3)}
.rankrow .rp{font-family:var(--font-d);font-weight:700;font-variant-numeric:tabular-nums}
.distbar{display:flex;align-items:center;gap:12px;margin:7px 0}
.distbar .dl{width:150px;flex:none;font-family:var(--font-d);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt2)}
.distbar .db{flex:1;height:9px;background:var(--line);position:relative}
.distbar .db i{position:absolute;left:0;top:0;bottom:0;background:var(--accent2)}
.distbar .dv{width:110px;text-align:right;font-family:var(--font-d);font-weight:600;font-variant-numeric:tabular-nums;font-size:12.5px;flex:none}

/* --- Prêts / score --- */
.gauge{height:10px;background:var(--line);position:relative;margin:8px 0 4px}
.gauge i{position:absolute;left:0;top:0;bottom:0;background:var(--gc,var(--ok));transition:width .5s}
.gauge .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bg)}
.scorehead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.scorehead .sv{font-family:var(--font-d);font-weight:700;font-size:38px;font-variant-numeric:tabular-nums;line-height:1}
.loancard{border:1px solid var(--line);background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:8px;position:relative}
.loancard .ln{font-family:var(--font-d);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.loancard .kv3{display:flex;justify-content:space-between;font-size:14px;color:var(--txt2)}
.loancard .kv3 b{color:var(--txt);font-variant-numeric:tabular-nums}
.loanrow{border:1px solid var(--line);background:var(--panel);padding:16px;margin-bottom:12px}
.loanrow.overdue{border-color:var(--bad)}
.loanrow .lt{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.fragrow{display:flex;align-items:center;gap:12px;margin:8px 0}
.fragrow .fn{font-family:var(--font-d);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt2);width:150px;flex:none}
.fragrow .fb{flex:1;height:8px;background:var(--line);position:relative}
.fragrow .fb i{position:absolute;left:0;top:0;bottom:0;background:var(--accent2)}
.fragrow .fv{font-family:var(--font-d);font-size:11.5px;color:var(--txt3);flex:none;font-variant-numeric:tabular-nums}

.oddsrow{display:flex;align-items:center;gap:12px;padding:6px 0}
.oddsrow .ol{width:96px;flex:none;font-family:var(--font-d);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.oddsrow .ob{flex:1;height:8px;background:var(--line);position:relative}
.oddsrow .ob i{position:absolute;left:0;top:0;bottom:0;background:var(--rr)}
.oddsrow .ov{width:64px;text-align:right;font-family:var(--font-d);font-weight:700;font-variant-numeric:tabular-nums;color:var(--txt2);font-size:13px}
.hero{display:grid;grid-template-columns:1.7fr 1fr;gap:18px}
.heroart{position:relative;background:var(--panel);border:1px solid var(--line);padding:26px;overflow:hidden;min-height:300px;display:flex;flex-direction:column}
.heroart .halo{position:absolute;inset:0;background:radial-gradient(closest-side at 50% 55%,var(--accent-soft),transparent 70%);pointer-events:none}
.heroart svg.big{width:100%;max-height:230px;margin:auto 0;filter:drop-shadow(0 14px 30px rgba(0,0,0,.65));z-index:1}
.quickrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:none}
.mrow .mi{flex:1;font-weight:600;font-size:15px}
.mprog{height:5px;background:var(--line);position:relative;margin-top:8px;max-width:420px}
.mprog i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.claim{font-family:var(--font-d);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--warn);color:var(--warn);transition:.15s}
.claim:hover{background:var(--warn);color:#131313}
.claim:disabled{opacity:.35;pointer-events:none}
.claim.done{border-color:var(--ok);color:var(--ok);pointer-events:none}
.newsticker{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--panel);border:1px solid var(--line);margin-bottom:18px;cursor:pointer;transition:border-color .15s}
.newsticker:hover{border-color:var(--accent2)}
.gamerow{display:flex;align-items:center;gap:22px;padding:22px;background:var(--panel);border:1px solid var(--line);margin-bottom:14px;transition:border-color .15s;cursor:pointer;position:relative;overflow:hidden}
.gamerow:hover{border-color:var(--accent)}
.gamerow .gnum{font-family:var(--font-d);font-weight:700;font-size:13px;color:var(--txt3);border:1px solid var(--line2);width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.gamerow .gic{width:54px;height:54px;color:var(--accent);flex:none}
.gamerow .gtx .g1{font-family:var(--font-d);font-weight:700;font-size:20px;letter-spacing:.1em;text-transform:uppercase}
.gamerow .gtx .g2{color:var(--txt2);margin-top:2px;max-width:640px}
.gamerow .ggo{margin-left:auto;font-family:var(--font-d);color:var(--accent);font-size:22px;flex:none}
.gamerow::after{content:'';position:absolute;top:0;right:0;bottom:0;width:3px;background:var(--accent);opacity:0;transition:.15s}
.gamerow:hover::after{opacity:1}
.invbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.invbar .tfield{min-width:200px;flex:1}
.idetail{position:fixed;top:0;right:-420px;width:min(400px,94vw);height:100vh;background:var(--panel);border-left:1px solid var(--line2);z-index:120;transition:right .3s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
.idetail.open{right:0}
.idetail .idh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.idetail .idb{flex:1;overflow-y:auto;padding:20px}
.idetail .idf{padding:16px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.idart{--rr:var(--r-common);background:var(--bg2);border:1px solid var(--rr);padding:22px;margin-bottom:16px}
.idart svg{width:100%;max-height:170px;margin:auto}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv .k{color:var(--txt3)}
.kv .v{font-weight:600;font-variant-numeric:tabular-nums}
.wear{height:6px;background:var(--line);position:relative;margin:8px 0 4px}
.wear i{position:absolute;left:0;top:0;bottom:0;background:var(--accent2)}
.mklayout{display:grid;grid-template-columns:250px 1fr;gap:18px}
.mkfilters{align-self:start;position:sticky;top:86px}
.mkrow{display:flex;align-items:center;gap:16px;padding:12px 16px;border:1px solid var(--line);background:var(--panel);margin-bottom:10px;transition:border-color .15s}
.mkrow:hover{border-color:var(--line2)}
.mkrow .mkart{width:110px;flex:none;padding:6px;cursor:pointer}
.mkrow .mkart svg{width:100%;height:44px}
.mkrow .mki{flex:1;min-width:0}
.mkrow .mkn{font-family:var(--font-d);font-weight:600;font-size:15px}
.mkrow .mks{font-size:13px;color:var(--txt3);margin-top:2px}
.mkrow .mkv{text-align:right;flex:none}
.mkrow .mkv .p{font-family:var(--font-d);font-weight:700;font-size:17px;color:var(--accent2);font-variant-numeric:tabular-nums}
.mkrow .mkv .s{font-size:12px;color:var(--txt3)}
.mkrow.mine{border-color:var(--warn)}
.prange{display:flex;gap:8px}
.prange input{width:100%;background:var(--bg2);border:1px solid var(--line);padding:8px 10px;outline:none;font-variant-numeric:tabular-nums}
.prange input:focus{border-color:var(--accent)}
.csel{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cpool{max-height:560px;overflow-y:auto}
.cforgezone{position:sticky;top:86px;align-self:start}
.contractbar{--rr:var(--r-common);background:var(--bg2);border:1px solid var(--rr);padding:10px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;animation:pop .3s}
.contractbar .cn{font-family:var(--font-d);font-weight:600;font-size:13px;flex:1}
.contractbar .cv{font-family:var(--font-d);color:var(--txt2);font-variant-numeric:tabular-nums;font-size:12.5px}
.crules li{margin:8px 0 8px 18px;color:var(--txt2);font-size:15px}
.collgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.collcard{border:1px solid var(--line);background:var(--panel);padding:16px;cursor:pointer;transition:border-color .15s}
.collcard:hover{border-color:var(--line2)}
.collcard.sel{border-color:var(--accent)}
.collcard .cn{font-family:var(--font-d);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.collcard .ct{font-size:12.5px;color:var(--txt3);margin:3px 0 12px}
.cprog{height:5px;background:var(--line);position:relative}
.cprog i{position:absolute;left:0;top:0;bottom:0;background:var(--accent2)}
.collcard .cp{font-family:var(--font-d);font-size:11px;color:var(--txt2);margin-top:6px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
.pflayout{display:grid;grid-template-columns:340px 1fr;gap:18px}
.pfcard{align-self:start;position:sticky;top:86px;text-align:center}
.pfav{width:130px;height:130px;margin:6px auto 14px;border:1px solid var(--line2)}
.pfname{font-family:var(--font-d);font-weight:700;font-size:22px;letter-spacing:.04em}
.pftitle{font-family:var(--font-d);font-size:11px;letter-spacing:.24em;color:var(--accent2);text-transform:uppercase;margin-top:4px}
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);padding:12px;background:var(--bg2);opacity:.4}
.badge.owned{opacity:1;border-color:var(--warn)}
.badge .bn{font-family:var(--font-d);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.badge .bd{font-size:12.5px;color:var(--txt3);margin-top:4px}
.badge.owned .bn{color:var(--warn)}
.fxaura{display:inline-block;padding:3px 10px;font-family:var(--font-d);font-size:10px;letter-spacing:.2em;text-transform:uppercase;border:1px solid currentColor;animation:aurapulse 2s infinite}
@keyframes aurapulse{0%,100%{color:var(--accent)}50%{color:var(--accent2)}}
.showgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.showslot{min-height:220px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line2);color:var(--txt3);cursor:pointer;position:relative;transition:border-color .15s;background:var(--bg2)}
.showslot:hover{border-color:var(--accent)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px}
.shopcard{border:1px solid var(--line);background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:10px}
.shopcard .sn{font-family:var(--font-d);font-weight:600;font-size:14.5px}
.shopcard .sd{font-size:13px;color:var(--txt3);flex:1}
.shopcard.owned{border-color:var(--ok)}
.themedot{width:34px;height:34px;border:1px solid var(--line2);position:relative;overflow:hidden}
.themedot i{position:absolute;inset:4px}
.donut{width:180px;height:180px;border-radius:50%;margin:12px auto;position:relative}
.donut::after{content:attr(data-total);position:absolute;inset:26px;background:var(--panel);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.legend .lg{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--txt2)}
.legend .lg i{width:10px;height:10px;flex:none}
.mirow{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.mirow .mi{flex:1}
.chartbars{display:flex;align-items:flex-end;gap:10px;height:190px;padding:10px 4px 0}
.chartbars .cb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;height:100%}
.chartbars .cb .b{background:var(--accent);min-height:2px}
.chartbars .cb .b2{background:var(--accent2);min-height:0}
.chartbars .cbl{margin-top:8px;text-align:center;font-family:var(--font-d);font-size:10px;color:var(--txt3);letter-spacing:.1em}
#toasts{position:fixed;top:18px;right:18px;z-index:500;display:flex;flex-direction:column;gap:10px;max-width:min(360px,92vw)}
.toast{--tc:var(--accent);background:var(--panel2);border:1px solid var(--tc);border-left-width:3px;padding:12px 16px;display:flex;gap:12px;align-items:center;animation:toastin .3s cubic-bezier(.2,1.4,.4,1);box-shadow:0 10px 34px rgba(0,0,0,.5)}
.toast .tt{font-family:var(--font-d);font-weight:600;font-size:13px;letter-spacing:.06em}
.toast .tm{font-size:13px;color:var(--txt2)}
.toast.out{animation:toastout .25s forwards}
@keyframes toastin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastout{to{transform:translateX(40px);opacity:0}}
#modalroot{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;background:rgba(8,9,12,.72);backdrop-filter:blur(8px);padding:18px}
#modalroot.open{display:flex}
.modal{width:min(560px,94vw);max-height:88vh;overflow-y:auto;background:rgba(19,21,27,.97);border:1px solid var(--line2);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh .mt{font-family:var(--font-d);font-weight:700;font-size:14px;letter-spacing:.22em;text-transform:uppercase}
.modal .mb{padding:20px}
.modal .mf{padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--line2);color:var(--txt);padding:5px 10px;font-size:12.5px;white-space:nowrap;z-index:90;font-family:var(--font-b);font-weight:600;pointer-events:none}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fadin{animation:fadein .35s}
.legalfoot{margin-top:34px;padding:18px 0 6px;border-top:1px solid var(--line);display:flex;gap:16px;align-items:center;justify-content:center;color:var(--txt3);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--font-d);text-align:center;flex-wrap:wrap}
.lvlbox{text-align:center;padding:14px 0}
.lvlbox .lb1{font-family:var(--font-d);font-size:12px;letter-spacing:.4em;color:var(--accent2);text-transform:uppercase}
.lvlbox .lb2{font-family:var(--font-d);font-weight:700;font-size:74px;line-height:1.1}
.lvlbox .lb3{color:var(--txt2)}
.lvlbox .lb4{margin-top:12px;font-family:var(--font-d);font-size:12px;color:var(--ok);letter-spacing:.1em}
.caselist{max-height:70vh;overflow-y:auto}

@media (max-width:1100px){
  .hero{grid-template-columns:1fr}
  .mklayout{grid-template-columns:1fr}.mkfilters{position:static}
  .pflayout{grid-template-columns:1fr}.pfcard{position:static}
  .csel{grid-template-columns:1fr}.cforgezone{position:static}
  .plklayout{grid-template-columns:1fr}
  #plcv{height:420px}
}
@media (max-width:900px){
  #side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .3s;box-shadow:20px 0 60px rgba(0,0,0,.6)}

/* ============ 4. MOTEUR ÉCONOMIQUE (cotes) ============ */
function genSeries(rnd,base,vol){
  let v=base*(0.72+rnd()*0.3),series=[],regime=Math.floor(rnd()*3)-1,left=6+Math.floor(rnd()*20),mom=0;
  for(let d=0;d<190;d++){
    if(left--<=0){ regime=Math.floor(rnd()*3)-1; left=6+Math.floor(rnd()*20); }
    mom=mom*0.84+(rnd()-0.5)*vol;
    const shock=rnd()<0.022?(rnd()-0.5)*vol*9:0;
    v*=1+regime*vol*0.32+mom+shock;
    v+=(base-v)*0.004;
    series.push(Math.max(Math.round(base*0.18),Math.round(v)));
  }
  return series;
}
function initEcon(){
  const rnd=mulberry(S.econSeed==null?(S.econSeed=Math.floor(Math.random()*1e9)):S.econSeed);
  S.econ={hist:{},live:{},news:[],vol:{},owners:{},pop:{},trend:{},press:{},day:dayKey()};
  for(const it of ITEMS){
    const volf={common:.009,uncommon:.011,rare:.014,epic:.019,legendary:.026,mythic:.04}[it.rarity];
    const series=genSeries(mulberry(Math.floor(rnd()*1e9)),it.value,volf);
    S.econ.hist[it.id]=series;
    S.econ.live[it.id]=Math.round(series[series.length-1]*(1+(rnd()-0.5)*0.05));
    S.econ.trend[it.id]={regime:Math.floor(rnd()*3)-1,left:4+Math.floor(rnd()*26)};
    S.econ.pop[it.id]=8+Math.floor(rnd()*82);
    const own={mythic:[3,9],legendary:[12,70],epic:[90,380],rare:[350,1200],uncommon:[900,3800],common:[2600,9000]}[it.rarity];
    S.econ.owners[it.id]=own[0]+Math.floor(rnd()*(own[1]-own[0]));
    S.econ.vol[it.id]={v:Math.floor(200+rnd()*4000),d:Math.floor(S.econ.pop[it.id]*2+rnd()*400)};
  }
  genInitialNews();
}
function priceOf(id){ return S&&S.econ?S.econ.live[id]:ITEM[id].value; }
function invVal(x){ return Math.round(priceOf(x.itemId)*WEARS.find(w=>w.id===x.wear).mult); }
function deltas(id){
  const h=S.econ.hist[id],live=S.econ.live[id],n=h.length;
  return {d1:live/h[n-1]-1,d7:live/h[Math.max(0,n-7)]-1,d30:live/h[Math.max(0,n-30)]-1};
}
function volAt(id,idx){
  const h=S.econ.hist[id]; if(idx>=h.length) return S.econ.vol[id].d;
  const prev=h[Math.max(0,idx-1)];
  const mv=Math.abs(h[idx]/prev-1);
  const r=mulberry(Math.abs(hashStr(id))^(idx*7919));
  return Math.floor((60+r()*260)*(1+mv*38)+S.econ.pop[id]*3);
}
function volDayRel(id){ const v=S.econ.vol[id]; const avg=v.v/Math.max(1,190); return v.d/Math.max(20,avg); }
function trendTag(it){
  const {d1}=deltas(it.id),hot=volDayRel(it.id)>2.6;
  if(hot&&d1>0.015) return {cls:'hot',label:'HOT',ic:'bolt'};
  if(Math.abs(d1)>0.03&&hot) return {cls:'trending',label:'TRENDING',ic:'flame'};
  if(d1>0.02) return {cls:'rising',label:'RISING',ic:'tup'};
  if(d1<-0.02) return {cls:'falling',label:'FALLING',ic:'tdn'};
  if(S.econ.owners[it.id]<18) return {cls:'rare',label:'RARE',ic:'diamond'};
  if(RAR[it.rarity].rank>=5&&priceOf(it.id)>30000) return {cls:'legendary',label:'LEGENDARY',ic:'crown'};
  return null;
}
function trendTagHTML(it){ const t=trendTag(it); return t?`<span class="ttag ${t.cls}">${icon(t.ic,11)}${t.label}</span>`:''; }
function tradeBuy(id,price){
  const e=S.econ; if(!e) return;
  e.press[id]=(e.press[id]||0)+1.5;
  e.owners[id]=(e.owners[id]||0)+1;
  e.vol[id].d+=Math.max(1,Math.round(price/400)); e.vol[id].v+=Math.max(1,Math.round(price/400));
}
function tradeSell(id,val){
  const e=S.econ; if(!e) return;
  e.press[id]=(e.press[id]||0)-1.2;
  e.vol[id].d+=Math.max(1,Math.round(val/400)); e.vol[id].v+=Math.max(1,Math.round(val/400));
}

function makeNews(ts){
  const tpl=pick(NEWS_TPL),r=Math.random();
  const colls=[]; let types=[];
  if(tpl.colls){ const c=pick(COLLECTIONS); colls.push(c.name); }
  if(tpl.type) types=[tpl.type];
  return {id:'n'+ts+Math.floor(Math.random()*999),ts,title:tpl.t(colls[0]||''),body:tpl.b(colls[0]||''),
    colls,types,dir:tpl.dir,strength:(0.0004+r*0.0011)*tpl.dir,born:ts,until:ts+(4+Math.random()*11)*60000};
}
function genInitialNews(){
  const now=Date.now();
  S.econ.news=[];
  for(let i=0;i<9;i++){
    const n=makeNews(now-Math.floor(Math.random()*48*3600000));
    if(i<2) n.until=now+Math.floor(Math.random()*8*60000);
    S.econ.news.push(n);
  }
  S.econ.news.sort((a,b)=>b.ts-a.ts);
}
function newsHits(n,it){ return n.global||n.colls.includes(it.coll)||(n.types&&n.types.includes(it.type)); }
function activeNews(){ return S.econ.news.filter(n=>n.until>Date.now()); }
let econTimer=null;
function econTick(){
  if(!S.econ) return;
  const now=Date.now(),act=activeNews();
  for(const it of ITEMS){
    const t=S.econ.trend[it.id];
    if(--t.left<=0){ t.regime=Math.floor(Math.random()*3)-1; t.left=4+rndi(26); }
    let d=t.regime*0.0007+(Math.random()-0.5)*0.0035;
    for(const n of act){ if(newsHits(n,it)) d+=n.strength; }
    d+=(S.econ.press[it.id]||0)*0.02;
    S.econ.press[it.id]=(S.econ.press[it.id]||0)*0.88;
    d=Math.max(-0.012,Math.min(0.012,d));
    S.econ.live[it.id]=Math.max(10,Math.round(S.econ.live[it.id]*(1+d)));
  }
  for(const it of ITEMS){
    let p=S.econ.pop[it.id]+deltas(it.id).d1*30+(Math.random()-0.5)*3;
    S.econ.pop[it.id]=Math.max(1,Math.min(100,Math.round(p)));
  }
  if(Math.random()<0.05&&act.length<6){
    const n=makeNews(now); S.econ.news.unshift(n);
    if(S.econ.news.length>40) S.econ.news.length=40;
    toast('MARKET NEWS',n.title,'warn',6000);
  }
  if(dayKey()!==S.econ.day){
    for(const it of ITEMS){
      S.econ.hist[it.id].push(S.econ.live[it.id]);
      if(S.econ.hist[it.id].length>190) S.econ.hist[it.id].shift();
      S.econ.vol[it.id].d=Math.floor(S.econ.pop[it.id]*2+Math.random()*300);
    }
    S.econ.day=dayKey();
  }
  loansTick();
  save();
  if(['market','portfolio','rankings','news','itemdetail','home','loans'].includes(currentView)
     && !document.getElementById('modalroot').classList.contains('open')
     && !document.querySelector('.gover.open')) render();
}

function seriesFor(id,period){
  const h=S.econ.hist[id],live=S.econ.live[id];
  const mk=arr=>arr.map((v,i)=>({t:Date.now()-(arr.length-1-i)*86400000,v,
    vol:i<arr.length-1?volAt(id,h.length-arr.length+i):S.econ.vol[id].d}));
  if(period==='1h'){
    const seed=Math.floor(Date.now()/60000),r=mulberry(seed^Math.abs(hashStr(id)));
    let v=live*(1-(r()-0.5)*0.03),pts=[];
    for(let i=0;i<24;i++){ pts.push({t:Date.now()-(23-i)*150000,v:Math.round(v),vol:Math.floor(20+r()*90)}); v*=1+(r()-0.5)*0.006; }
    pts.push({t:Date.now(),v:live,vol:S.econ.vol[id].d});
    return pts;
  }
  if(period==='24h'){
    const prev=h[h.length-2]||h[h.length-1],yest=h[h.length-1];
    const r=mulberry((Math.floor(Date.now()/3600000))^Math.abs(hashStr(id)));
    const pts=[];
    for(let i=0;i<24;i++){ const k=i/23; const v=prev+(yest-prev)*k+(r()-0.5)*prev*0.012;
      pts.push({t:Date.now()-(23-i)*3600000,v:Math.round(v),vol:Math.floor(40+r()*140)}); }
    pts.push({t:Date.now(),v:live,vol:S.econ.vol[id].d});
    return pts;
  }
  if(period==='7j') return mk(h.slice(-6).concat([live]));
  if(period==='30j') return mk(h.slice(-29).concat([live]));
  if(period==='3m') return mk(h.slice(-89).concat([live]));
  return mk(h.concat([live]));
}
function spark(id,days=30,w=64,h=22){
  const h_=S.econ.hist[id],pts=h_.slice(-days).concat([S.econ.live[id]]);
  const mn=Math.min(...pts),mx=Math.max(...pts),rg=mx-mn||1;
  const d1=deltas(id).d1,col=d1>0.005?'var(--ok)':d1<-0.005?'var(--bad)':'var(--txt3)';
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
  <polyline fill="none" stroke="${col}" stroke-width="1.6" points="${pts.map((v,i)=>`${(i/(pts.length-1)*w).toFixed(1)},${(h-2-(v-mn)/rg*(h-4)).toFixed(1)}`).join(' ')}"/></svg>`;
}

function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; } }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i)|0; } return h; }
function rndi(n){ return Math.floor(Math.random()*n); }
function pick(arr){ return arr[rndi(arr.length)]; }
function fmt(n){ return Math.round(n).toLocaleString('fr-FR'); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pct(v){ return (v>=0?'+':'')+(v*100).toFixed(2).replace('.',',')+'%'; }
function rollWear(){ const r=Math.random()*100; let a=0; for(const w of WEARS){ a+=w.w; if(r<a) return w; } return WEARS[2]; }
function invValue(){ return S.inv.reduce((s,x)=>s+invVal(x),0); }
function has(id){ return S.shopOwned.includes(id); }
function xpNeed(l){ return 900+(l-1)*260; }

let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(f,dur=.08,type='square',g=.05,when=0,slide=0){
  if(!S||!S.settings.sound) return; const c=ac(); if(!c) return;
  const t=c.currentTime+when,o=c.createOscillator(),gn=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+dur);
  gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gn).connect(c.destination); o.start(t); o.stop(t+dur+.02);
}

function burst(x,y,color,n=40,power=7){
  for(let i=0;i<n;i++){ const a=Math.random()*6.28,v=Math.random()*power+1;
    fxBursts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,life:1,r:Math.random()*2.5+1,c:color}); }
}

function fxLoop(){
  fxx.clearRect(0,0,fxcv.width,fxcv.height);
  fxBursts=fxBursts.filter(p=>p.life>0);
  for(const p of fxBursts){
    p.x+=p.vx; p.y+=p.vy; p.vy+=.22; p.vx*=.985; p.life-=.016;
    fxx.globalAlpha=Math.max(0,p.life); fxx.fillStyle=p.c;
    fxx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r);
  }
  fxx.globalAlpha=1; requestAnimationFrame(fxLoop);
}

/* ============ 8. ÉCONOMIE DU JEU (objets d'abord) ============ */
function isPrac(){ return S.settings.practice; }
function balance(){ return isPrac()?S.demoCredits:S.credits; }
function addCredits(n,silent){
  if(isPrac()) S.demoCredits=Math.max(0,S.demoCredits+n);
  else{ S.credits=Math.max(0,S.credits+n); if(n>0){ S.stats.creditsWon+=n; seedDaily().won+=n; } }
  updateHeader(); if(!silent&&n>0) countUp('hbal',balance());
}
function spendCredits(n){ if(balance()<n) return false;
  if(isPrac()) S.demoCredits-=n;
  else{ S.credits-=n; S.stats.creditsSpent+=n; seedDaily().spent+=n; }
  updateHeader(); return true; }
function countUp(id,target){
  const el=document.getElementById(id); if(!el) return;
  const from=parseInt(el.textContent.replace(/\s/g,''))||0,t0=performance.now(),dur=700;
  (function step(t){ const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
    el.textContent=fmt(from+(target-from)*e); if(k<1) requestAnimationFrame(step); })(t0);
}
function addXP(n){
  if(isPrac()||n<=0) return;
  S.xp+=n; let ups=[];
  while(S.xp>=xpNeed(S.level)){ S.xp-=xpNeed(S.level); S.level++; ups.push(S.level); }
  if(ups.length){
    const lv=ups[ups.length-1],bonus=500*ups.length;
    addCredits(bonus,true); sfx.rare();
    openModal(`<div class="mh"><div class="mt">Niveau supérieur</div></div>
      <div class="mb"><div class="lvlbox"><div class="lb1">Promotion</div><div class="lb2">${lv}</div>
      <div class="lb3">Vous déboguez de nouveaux contenus.</div>
      <div class="lb4">+${fmt(bonus)} Credits de prime</div>${unlockNote(lv)}</div></div>
      <div class="mf"><button class="btn pri" data-action="close-modal">Continuer</button></div>`);
    burst(innerWidth/2,innerHeight/2,'#ff8c1a',80,10);
    hist('level',`Niveau ${lv} atteint`,`+${fmt(bonus)} Credits`,bonus);
    checkBadges();
  }
  updateHeader();
}
function unlockNote(lv){ const c=CASES.filter(c=>c.minLvl===lv).map(c=>c.name).join(', '); return c?`<div class="lb4" style="color:var(--accent2)">Débloqué : ${c}</div>`:''; }
function hist(type,label,sub,delta){
  S.history.unshift({ts:Date.now(),type,label,sub:sub||'',delta:delta||0});
  if(S.history.length>300) S.history.length=300;
}
function missionEvent(ev,amount=1){
  if(!S.missions||S.missions.date!==dayKey()) return;
  let changed=false;
  for(const m of S.missions.list){
    if(m.ev===ev&&!m.claimed){ m.progress=m.raw?m.progress+amount:Math.min(m.goal,m.progress+amount); changed=true; }
  }
  if(changed&&currentView==='missions') render();
}
function checkBadges(){
  const st={...S.stats,invCount:S.inv.length};
  for(const b of BADGES){
    if(!S.badges.includes(b.id)&&b.test(st)){
      S.badges.push(b.id); toast('Badge débloqué',b.name,'warn',5000);
      hist('badge','Badge débloqué : '+b.name,'',0); sfx.win();
    }
  }
}
function gameFinished(win,wager){
  S.stats.games++; seedDaily().games++;
  missionEvent('game'); if(win) missionEvent('win');
  missionEvent('wager',Math.round(wager||0));
  if((wager||0)>=10000) S.stats.highRoller=true;
  S.stats.wagered+=wager||0;
  checkBadges(); checkGuarantees(); save();
}

/* --- Attribution d'objets : le cœur du jeu --- */
function grantItem(itemId,wear,source,opts={}){
  const it=ITEM[itemId],rk=it.rarity;
  if(isPrac()){ if(!opts.quiet) toast('Mode entraînement','Récompense virtuelle non conservée.','warn'); return; }
  const hadType=S.inv.some(x=>ITEM[x.itemId].type===it.type);
  const hadSkin=S.inv.some(x=>ITEM[x.itemId].weapon===it.weapon);
  S.inv.push({uid:uid(),itemId,wear:wear.id,at:Date.now(),fav:false});
  S.stats.rarities[rk]++; seedDaily().drops++;
  S.stats.invCount=Math.max(S.stats.invCount,S.inv.length);
  hist('drop',`${it.weapon} « ${it.skin} »`,`${RAR[rk].name} · ${wear.name} · cote ${fmt(Math.round(priceOf(itemId)*wear.mult))} CR`,0);
  if(rk==='mythic') toast('MYTHIC DROP',`${it.weapon} « ${it.skin} »`,'bad',7000);
  else if(rk==='legendary') toast('LEGENDARY DROP',`${it.weapon} « ${it.skin} »`,'warn',6000);
  else if(!opts.quiet){
    if(!hadType&&['rifle','smg','pistol','sniper','knife'].includes(it.type)) toast('NEW WEAPON DISCOVERED',it.weapon,'ok',5000);
    else if(!hadSkin) toast('NEW SKIN UNLOCKED',`${it.weapon} « ${it.skin} »`,'ok',4500);
    else toast('ITEM ACQUIRED',`${it.weapon} « ${it.skin} » · ${RAR[rk].name}`,'ok',3500);
  }
  if(rk!=='common') missionEvent('raredrop');
  missionEvent('crate');
  /* Collection complétée ? */
  const collItems=ITEMS.filter(i=>i.coll===it.coll&&!i.secret);
  if(collItems.every(i=>S.inv.some(x=>x.itemId===i.id))){
    toast('COLLECTION COMPLETED',`${it.coll} — vérifiez le Collection Book`,'warn',7000);
    hist('badge',`Collection ${it.coll} complétée`,'',0);
  }
  checkBadges(); save();
}
function grantFragments(n,key){
  if(isPrac()){ toast('Mode entraînement','Fragments virtuels non conservés.','warn'); return; }
  if(!key){ /* collection pondérée */
    const weighted=[...FRAG_KEYS,...FRAG_KEYS.slice(0,7)];
    key=pick(weighted);
  }
  S.frags[key]=(S.frags[key]||0)+n;
  toast('BONUS DROP',`${n}x Fragments ${FRAG_NAMES[key]}`,'info',3000);
  hist('frag',`Fragments ${FRAG_NAMES[key]} x${n}`,`Total : ${S.frags[key]}/10`,0);
  save();
}
function drawReward(rank){
  rank=Math.max(0,Math.min(5,rank));
  if(rank===0) return {kind:'frag',n:2+rndi(3)};
  const odds=TIER_ODDS[rank],r=Math.random()*100; let a=0,rk='common';
  for(const k of RARKEYS){ a+=odds[k]||0; if(r<a){ rk=k; break; } }
  if(!POOL(rk).length) rk='uncommon';
  const rew={kind:'item',item:pick(POOL(rk)),wear:rollWear()};
  if(Math.random()<0.25) rew.bonus={n:1+rndi(2)};
  return rew;
}
function rewardOverlay(rew,title){
  const it=rew.item,r=RAR[it.rarity];
  openGameOverlay(`<div class="gbox" style="max-width:860px">
    <div class="ghead"><div class="gtitle"><b>${title||'REWARD DROP'}</b></div>
      <button class="iconbtn" data-action="reward-close">${icon('close')}</button></div>
    <div class="reveal r-${it.rarity} show" style="--rr:${r.color};margin:0">
      <div class="rvart">${artSVG(it)}</div>
      <div class="rinfo">
        <div class="rrar">${r.name} · ${WEARS.find(w=>w.id===rew.wear.id).name}</div>
        <div class="rnm">${it.weapon}<br>«&nbsp;${it.skin}&nbsp;»</div>
        <div class="rw"><span>Cote du marché</span><b>${fmt(Math.round(priceOf(it.id)*rew.wear.mult))} CR</b></div>
        ${rew.bonus?`<div class="rw"><span>Bonus</span><b>+${rew.bonus.n} fragments</b></div>`:''}
        <div class="rbtns"><button class="btn pri cut" data-action="reward-close">${icon('check',14)} Ranger</button></div>
      </div></div></div>`);
  if(it.rarity==='mythic'||it.rarity==='legendary'){ sfx.rare(); burst(innerWidth/2,innerHeight/2,RAR[it.rarity].hex,70,10); }
  else sfx.win();
}
function grantReward(rew,opts={}){
  if(isPrac()){ toast('Mode entraînement','Récompense virtuelle non conservée.','warn'); return; }
  if(rew.kind==='frag'){ grantFragments(rew.n,opts.coll); return; }
  const showOverlay=!opts.auto&&!document.querySelector('.gover.open');
  grantItem(rew.item.id,rew.wear,opts.source||'jeu',{quiet:opts.auto||!showOverlay});
  if(rew.bonus) grantFragments(rew.bonus.n);
  if(showOverlay) rewardOverlay(rew,opts.title);
}
function rewardTableHTML(){
  return `<table class="pltable">
    <tr><th>Rang</th><th>Contenu</th><th>Common</th><th>Unc.</th><th>Rare</th><th>Epic</th><th>Leg.</th><th>Myth.</th></tr>
    <tr><td>R0</td><td style="text-align:left">2–4 fragments de case</td><td colspan="6" style="color:var(--txt3);font-family:var(--font-b)">—</td></tr>
    ${[1,2,3,4,5].map(t=>`<tr><td>R${t}</td><td style="text-align:left">Objet ${t>=2?'+ fragments possibles':''}</td>${RARKEYS.map(k=>`<td>${TIER_ODDS[t][k]?TIER_ODDS[t][k]+'%':'—'}</td>`).join('')}</tr>`).join('')}
    <tr><td colspan="8" style="text-align:left;font-family:var(--font-b);color:var(--txt3)">Rangs R1+ : 25% de bonus fragments. Tout objet rejoint directement l'inventaire — aucune récompense en Credits.</td></tr>
  </table>`;

/* Récompenses garanties */
function checkGuarantees(){
  if(!S.guar) S.guar={idx:0,extra:0};
  const g=GUAR;
  while(S.guar.idx<g.length&&S.stats.games>=g[S.guar.idx].at){
    const step=g[S.guar.idx]; S.guar.idx++;
    toast('RÉCOMPENSE GARANTIE',step.txt,'ok',6000);
    if(step.kind==='case'){
      const id=pick(step.caseIds);
      S.freeCases[id]=(S.freeCases[id]||0)+1;
      toast('CASE GRATUITE OBTENUE',CASE[id].name+' ajoutée — ouvrez-la depuis Case Drop','ok',7000);
      hist('casefree',`Case gratuite : ${CASE[id].name}`,'Palier '+step.at+' manches',0);
    } else grantReward(drawReward(step.rank),{source:'garantie',title:'GARANTEED DROP'});
    save();
  }
  if(S.guar.idx>=g.length){
    const extra=Math.floor((S.stats.games-100)/50);
    if(extra>(S.guar.extra||0)){
      S.guar.extra=extra;
      toast('RÉCOMPENSE GARANTIE','50 manches supplémentaires — objet Rare+','ok',6000);
      grantReward(drawReward(3),{source:'garantie',title:'GARANTEED DROP'});
      save();
    }
  }
}

/* ============ 9. PRÊTS VIRTUELS (CREDIT LOANS) ============ */
function loanAmount(t){ return Math.round(t.base*(1+(S.level-1)*0.06)); }
function loanRate(t){ let r=t.rate; const s=S.loans.score; if(s<500) r+=0.05; else if(s<700) r+=0.02; return r; }
function loanDue(t){ return Math.round(loanAmount(t)*(1+loanRate(t))); }
function maxDebt(){ return Math.round(S.loans.score/100*S.level*9000); }
function maxActiveLoans(){ const s=S.loans.score; return s<500?0:s<700?1:s<850?2:3; }
function scoreLevel(s){ return s>=850?'Excellent':s>=700?'Good':s>=500?'Fair':'Poor'; }
function scoreColor(s){ return s>=850?'var(--ok)':s>=700?'var(--accent2)':s>=500?'var(--warn)':'var(--bad)'; }
function takeLoan(typeId,collatUid){
  if(isPrac()){ toast('Indisponible en entraînement','Les prêts concernent votre profil normal.','warn'); return; }
  const t=LOAN_TYPES.find(x=>x.id===typeId); if(!t) return;
  if(S.level<t.minLvl){ toast('Niveau insuffisant',`Niveau ${t.minLvl} requis.`,'warn'); return; }
  if(S.loans.cd>Date.now()){ toast('Refroidissement actif','Attendez un instant avant un nouveau prêt.','warn'); return; }
  if(S.loans.active.length>=maxActiveLoans()){ toast('Limite de prêts actifs',`Votre Credit Score (${S.loans.score}) autorise ${maxActiveLoans()} prêt(s) simultané(s).`,'bad'); return; }
  const amount=loanAmount(t),due=loanDue(t);
  let collat=null,extra=0;
  if(collatUid){
    const x=S.inv.find(i=>i.uid===+collatUid); if(!x) return;
    collat={uid:x.uid,itemId:x.itemId,wear:x.wear};
    extra=Math.round(invVal(x)*0.9);
  }
  if(totalDebt()+amount>maxDebt()+extra){
    toast('Limite d\'endettement',`Plafond actuel : ${fmt(maxDebt()+extra)} CR de dette cumulée.`,'bad');
    return;
  }
  const dueDate=new Date(Date.now()+t.days*86400000).toLocaleDateString('fr-FR');
  confirmModal('Contracter le prêt',
    `<div style="text-align:center">
      <div class="bigval" style="color:var(--accent2)">${fmt(amount)}<span class="cur"></span></div>
      <div style="color:var(--txt2);margin:8px 0 16px">${esc(t.name)} — remboursement <b style="color:var(--warn)">${fmt(due)} CR</b> sous ${t.days} jours (taux ${(loanRate(t)*100).toFixed(1).replace('.',',')}%)</div>
      <div class="kv" style="text-align:left"><span class="k">Échéance</span><span class="v">${dueDate}</span></div>
      <div class="kv" style="text-align:left"><span class="k">Garantie</span><span class="v">${collat?ITEM[collat.itemId].weapon+' « '+ITEM[collat.itemId].skin+' »':'Aucune'}</span></div>
      <div class="kv" style="text-align:left"><span class="k">Dette après prêt</span><span class="v">${fmt(totalDebt()+amount)} CR</span></div>
      <div style="margin-top:14px;padding:12px;border:1px solid var(--warn);color:var(--txt2);font-size:14px;text-align:left">
      ${collat?'RÈGLE DE GARANTIE : remboursé → l\'objet revient dans votre inventaire. Non remboursé à l\'échéance +3 jours → l\'objet est saisi par la banque virtuelle.':'Sans garantie, un défaut dégrade fortement votre Credit Score.'}</div>
    </div>`,
    'Signer le contrat', ()=>{
      if(collat){ S.inv=S.inv.filter(i=>i.uid!==collat.uid); }
      const l={id:'l'+Date.now(),typeId,principal:amount,due,remaining:due,
        takenTs:Date.now(),dueTs:Date.now()+t.days*86400000,status:'active',collateral:collat};
      S.loans.active.push(l);
      addCredits(amount);
      toast('Prêt accordé',`+${fmt(amount)} Credits virtuels — échéance le ${dueDate}`,'ok',6000);
      hist('loan',`Prêt contracté : ${t.name}`,`${fmt(amount)} CR · à rembourser ${fmt(due)} CR`,amount);
      sfx.coin(); save(); render();
    });
}
function repayLoan(id,amount){
  const l=S.loans.active.find(x=>x.id===id); if(!l) return;
  const full=amount==='all';
  const pay=Math.min(full?l.remaining:Math.max(1,amount),l.remaining,balance());
  if(pay<=0){ sfx.error(); toast('Solde insuffisant','','bad'); return; }
  spendCredits(pay); l.remaining=Math.round(l.remaining-pay);
  const onTime=Date.now()<=l.dueTs;
  hist('loanrepay','Remboursement de prêt',`${fmt(pay)} CR · restant ${fmt(l.remaining)}`,-pay);
  if(l.remaining<=0){
    const catchup=l.status==='overdue';
    const gain=catchup?80:onTime?25:15;
    S.loans.score=Math.min(1000,S.loans.score+gain);
    if(l.collateral){
      S.inv.push({uid:uid(),itemId:l.collateral.itemId,wear:l.collateral.wear,at:Date.now(),fav:false});
      toast('GARANTIE LIBÉRÉE',`${ITEM[l.collateral.itemId].weapon} revient dans votre inventaire`,'ok',6000);
    }
    l.status='repaid'; l.closedTs=Date.now();
    S.loans.active=S.loans.active.filter(x=>x.id!==id);
    S.loans.history.unshift(l);
    if(S.loans.history.length>30) S.loans.history.length=30;
    S.loans.cd=Date.now()+60000;
    S.stats.loansRepaid++;
    toast('PRÊT REMBOURSÉ',catchup?`Retard rattrapé — Credit Score +${gain}`:`Credit Score +${gain}`,'ok',6000);
  } else {
    if(onTime) S.loans.score=Math.min(1000,S.loans.score+4);
    toast('Acompte enregistré',`Restant : ${fmt(l.remaining)} CR`,'info');
  }
  sfx.coin(); checkBadges(); save(); render();
}
function loansTick(){
  let ch=false;
  for(const l of S.loans.active){
    if(l.status==='active'&&Date.now()>l.dueTs){
      l.status='overdue';
      S.loans.score=Math.max(300,S.loans.score-40);
      toast('PRÊT EN RETARD',`${fmt(l.remaining)} CR restants — Credit Score -40`,'bad',7000);
      hist('sys','Retard de prêt','Credit Score -40',0);
      ch=true;
    }
    if(l.status==='overdue'&&l.collateral&&Date.now()>l.dueTs+3*86400000){
      l.status='defaulted';
      S.loans.score=Math.max(300,S.loans.score-100);
      const it=ITEM[l.collateral.itemId];
      hist('sys','Défaut — garantie saisie',`${it.weapon} « ${it.skin} » transféré à la banque`,0);
      toast('GARANTIE SAISIE',`${it.weapon} « ${it.skin} » est perdu. Credit Score -100.`,'bad',8000);
      S.loans.active=S.loans.active.filter(x=>x.id!==l.id);
      S.loans.history.unshift(l);
      ch=true;
    }
  }
  if(ch) save();
}

function openCase(cid,free){
  const c=CASE[cid];
  if(S.level<c.minLvl) return;
  const hasFree=S.freeCases[cid]>0;
  if(!free||!hasFree){
    if(!spendCredits(c.price)){ sfx.error(); toast('Fonds insuffisants','Vendez des objets, forgez des fragments ou contractez un prêt virtuel.','bad'); return; }
  } else S.freeCases[cid]--;
  opening=true; sfx.whoosh();
  const r=Math.random()*100; let acc=0,rk='common';
  for(const k of RARKEYS){ acc+=c.odds[k]; if(r<acc){ rk=k; break; } }
  const pool=casePool(c,rk);
  const item=pick(pool),wear=rollWear();
  const N=56,TARGET=48,CW=150,band=[];
  for(let i=0;i<N;i++) band.push(pick(casePool(c,pick(RARKEYS))));
  band[TARGET]={...item};
  const off=(Math.random()*70-35);
  openGameOverlay(`<div class="gbox">
    <div class="ghead"><div class="gtitle">Ouverture — <b>${c.name}</b></div>
      <button class="iconbtn" data-action="case-skip">${icon('close')}</button></div>
    <div class="band" id="caseband"><div class="gl l"></div><div class="gl r"></div><div class="marker"></div>
      <div class="track" id="casetrack" style="transform:translateX(0)">
        ${band.map(b=>`<div class="bcell"><div class="br" style="color:${RAR[b.rarity].color}">${RAR[b.rarity].name}</div>${artSVG(b)}<div class="bn">${b.weapon}</div></div>`).join('')}
      </div></div>
    <div class="reveal r-${item.rarity}" id="casereveal" style="--rr:${RAR[item.rarity].color}">
      <div class="rvart">${artSVG(item)}</div>
      <div class="rinfo">
        <div class="rrar">${RAR[item.rarity].name} · ${wear.name}</div>
        <div class="rnm">${item.weapon}<br>«&nbsp;${item.skin}&nbsp;»</div>
        <div class="rw"><span>Cote du marché</span><b>${fmt(Math.round(priceOf(item.id)*wear.mult))} CR</b></div>
        <div class="rw"><span>Collection</span><b>${item.coll}</b></div>
        <div class="rbtns"><button class="btn cut" data-action="case-again" data-args="${cid}">${icon('refresh',15)} Recommencer</button>
        <button class="btn pri cut" data-action="case-close">Ranger</button></div>
      </div></div>
  </div>`);
  const track=document.getElementById('casetrack');
  const dist=-(TARGET*CW+75+off)+(document.querySelector('.gbox').clientWidth/2);
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
    track.style.transition='transform 6.4s cubic-bezier(.08,.82,.13,1)';
    track.style.transform=`translateX(${dist}px)`;
  });});
  let lastIdx=-1,t0=performance.now();
  (function tickLoop(t){
    if(!opening) return;
    if((t-t0)/6400<1){
      const m=getComputedStyle(track).transform;
      if(m!=='none'){ const x=new DOMMatrix(m).m41,idx=Math.floor(-x/CW);
        if(idx!==lastIdx){ lastIdx=idx; sfx.tick(); } }
      requestAnimationFrame(tickLoop);
    }
  })(t0);
  setTimeout(()=>{
    if(!opening) return;
    const rar=item.rarity;
    if(rar==='legendary'||rar==='mythic'){
      document.querySelector('.gbox').classList.add('shake'); sfx.boom();
      setTimeout(()=>document.querySelector('.gbox')?.classList.remove('shake'),500);
    }
    sfx.rare();
    const rv=document.getElementById('casereveal');
    rv.classList.add('show');
    burstAtEl(rv,RAR[rar].hex,rar==='mythic'?90:rar==='legendary'?60:30,rar==='mythic'?11:7);
    grantItem(item.id,wear,'case',{quiet:true});
    if(!isPrac()){ S.stats.crates++; addXP(25+RAR[rar].rank*10); }
    save();
  },6600);
}

  const out=[]; for(let i=0;i<Math.ceil(n/seq.length);i++) out.push(...seq);

      if(Math.random()<0.15) grantFragments(1+rndi(2));
      gameFinished(false,amt);
    }
    if(!isPrac()) S.stats.roulette.rounds++;
    const rh=document.getElementById('rouhist');
    if(rh) rh.innerHTML=rouState.hist.map(h=>`<div class="h ${h}">${h==='gold'?'JACKPOT':h==='red'?'R':h==='black'?'N':'B'}</div>`).join('');

function crashRank(m,base){ if(m<1.5) return 0; return Math.min(5,base+(m>=12?4:m>=5?3:m>=2.5?2:1)); }

function crashMount(){ if(CR.timer) return; startCrashRound(); }
function crashCleanup(){ if(CR.timer){ cancelAnimationFrame(CR.timer); CR.timer=null; } CR.phase='idle'; }
function startCrashRound(){
  CR.phase='betting'; CR.m=1; CR.crashAt=crashPoint(); CR.cashed=false; CR.betPlaced=false;
  let wait=6;
  const tick=()=>{
    if(currentView!=='crash') return;
    if(CR.phase==='betting'){
      const ph=document.getElementById('crphase'),sub=document.getElementById('crsub');
      if(ph) ph.textContent='PARIS OUVERTS — '+wait.toFixed(1)+'s';
      if(sub) sub.textContent=CR.betPlaced?`Mise engagée : ${fmt(CR.bet)} CR`:'Placez votre mise';
      wait-=0.1;
      if(wait<=0){ CR.phase='running'; CR.t0=performance.now(); }
      setTimeout(tick,100);
    } else if(CR.phase==='running') crashRun();
    else setTimeout(()=>{ if(currentView==='crash') startCrashRound(); },3200);
  };
  updateCrashBtn(); tick();
}
function crashRun(){
  const cv=document.getElementById('ccv'); if(!cv){ CR.timer=null; return; }
  const draw=()=>{
    if(currentView!=='crash'||CR.phase!=='running'){ CR.timer=null; return; }
    const el=(performance.now()-CR.t0)/1000;
    CR.m=Math.exp(0.14*el);
    const mult=document.getElementById('crmult');
    if(mult){ mult.textContent=CR.m.toFixed(2)+'x'; mult.parentElement.parentElement.classList.remove('crashed'); }
    const ph=document.getElementById('crphase'); if(ph) ph.textContent='EN VOL';
    const sub=document.getElementById('crsub');
    if(sub&&CR.betPlaced&&!CR.cashed){
      const rk=crashRank(CR.m,stakeBase(CR.bet));
      sub.textContent=`Encaisser maintenant : récompense de rang R${rk}`;
    } else if(sub) sub.textContent='';
    const W=cv.width=cv.clientWidth*2,H=cv.height=cv.clientHeight*2,g=cv.getContext('2d');
    g.clearRect(0,0,W,H);
    g.strokeStyle='#262b36'; g.lineWidth=1;
    for(let i=1;i<5;i++){ g.beginPath(); g.moveTo(0,H*i/5); g.lineTo(W,H*i/5); g.stroke(); }
    for(let i=1;i<8;i++){ g.beginPath(); g.moveTo(W*i/8,0); g.lineTo(W*i/8,H); g.stroke(); }
    const maxM=Math.max(2.2,CR.m*1.15),maxT=Math.max(6,el*1.1);
    g.strokeStyle='#ff3b30'; g.lineWidth=4; g.beginPath();
    for(let t=0;t<=el;t+=.05){ const x=(t/maxT)*W,y=H-((Math.exp(0.14*t)-1)/(maxM-1))*H*.92; t===0?g.moveTo(x,y):g.lineTo(x,y); }
    g.stroke();
    updateCrashBtn();
    if(CR.m>=CR.crashAt){
      CR.phase='crashed';
      if(mult){ mult.textContent=CR.crashAt.toFixed(2)+'x'; mult.parentElement.parentElement.classList.add('crashed'); }
      if(ph) ph.textContent='ÉCRASÉ';
      CR.hist.unshift(CR.crashAt); CR.hist.length=Math.min(CR.hist.length,12);
      const rh=document.getElementById('crhist');
      if(rh) rh.innerHTML=CR.hist.map(h=>`<div class="h ${h>=10?'gold':h>=2?'blue':'black'}">${h.toFixed(2)}x</div>`).join('');
      if(CR.betPlaced&&!CR.cashed){
        if(sub) sub.textContent=`Écrasé — mise de ${fmt(CR.bet)} CR consommée`;
        sfx.boom(); if(!isPrac()) hist('lose','Crash — écrasé à '+CR.crashAt.toFixed(2)+'x',`Mise ${fmt(CR.bet)} CR consommée`,-CR.bet);
        if(!isPrac()) S.stats.crash.rounds++;
        gameFinished(false,CR.bet);
      } else if(sub) sub.textContent='Manche terminée';
      updateCrashBtn(); CR.timer=null;
      setTimeout(()=>{ if(currentView==='crash') startCrashRound(); },3200);
      return;
    }
    CR.timer=requestAnimationFrame(draw);
  };
  updateCrashBtn(); draw();
}
function updateCrashBtn(){
  const b=document.getElementById('crmain'); if(!b) return;
  b.dataset.action='cr-main';
  if(CR.phase==='betting'){ b.className='btn pri cut'; b.innerHTML=icon('coin',15)+(CR.betPlaced?'Mise placée — annuler':'Placer la mise'); b.disabled=false; }
  else if(CR.phase==='running'){

      const rk=crashRank(CR.m,stakeBase(CR.bet));

}

function plinkoMount(){
  const cv=document.getElementById('plcv'); if(!cv) return;
  const M=PLINKO[PL.mode];
  const compute=()=>{
    const W=cv.clientWidth,H=cv.clientHeight;
    const dx=W/(M.rows+2),dy=(H-110)/(M.rows);
    const pegs=[];
    const rnd=mulberry(Math.abs(hashStr(PL.mode)));
    for(let i=0;i<M.rows;i++){
      const y=70+i*dy,even=(i%2===0);
      const n=even?M.rows+2:M.rows+1;
      for(let k=0;k<n;k++){
        let x=even?(k+0.5)*dx:(k+1)*dx;
        if(M.chaos) x+=(rnd()-0.5)*dx*0.34;
        pegs.push({x,y});
      }
    }
    PL.layout={W,H,dx,dy,pegs,yl:70+M.rows*dy+6,rows:M.rows};
  };
  compute();
  cv.width=cv.clientWidth*2; cv.height=cv.clientHeight*2;
  onResize=()=>{ if(currentView==='plinko'){ compute(); cv.width=cv.clientWidth*2; cv.height=cv.clientHeight*2; } };
  PL.last=performance.now(); PL.acc=0;
  if(PL.raf) cancelAnimationFrame(PL.raf);
  (function loop(t){
    if(currentView!=='plinko'){ PL.raf=null; return; }
    PL.raf=requestAnimationFrame(loop);
    let dt=(t-PL.last)/1000; PL.last=t; if(dt>0.05) dt=0.05;
    PL.acc+=dt;
    const step=1/240;
    while(PL.acc>=step){ plinkoStep(step); PL.acc-=step; }
    if(PL.autoLeft>0&&t-PL.lastDrop>700&&PL.balls.length<4){ PL.lastDrop=t; plinkoDrop(true); }
    plinkoDraw();
  })(PL.last);
}
let onResize=null;
addEventListener('resize',()=>{ if(onResize) onResize(); });
function plinkoStep(dt){
  const L=PL.layout; if(!L) return;
  for(const b of PL.balls){
    b.vy+=1650*dt;
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    for(const p of L.pegs){
      const dx=b.x-p.x,dy=b.y-p.y,d2=dx*dx+dy*dy,R=b.r+7;
      if(d2<R*R&&d2>0.0001){
        const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
        b.x=p.x+nx*R; b.y=p.y+ny*R;
        const vn=b.vx*nx+b.vy*ny;
        if(vn<0){ b.vx-=1.55*vn*nx; b.vy-=1.55*vn*ny; }
        b.vx+=(Math.random()-0.5)*36;
        const now=performance.now();
        if(now-PL.lastTick>70){ PL.lastTick=now; sfx.tick(); }
      }
    }
    if(b.x<b.r+4){ b.x=b.r+4; b.vx=Math.abs(b.vx)*0.7; }
    if(b.x>L.W-b.r-4){ b.x=L.W-b.r-4; b.vx=-Math.abs(b.vx)*0.7; }
    if(b.y>L.yl+30){
      const M=PLINKO[PL.mode];
      const bucket=Math.max(0,Math.min(M.mults.length-1,Math.floor(b.x/L.dx)));
      plinkoLand(b,bucket);
    }
  }
  PL.balls=PL.balls.filter(b=>!b.done);
}
function plinkoDrop(auto){
  const L=PL.layout; if(!L||PL.balls.length>=6) return;
  const amt=Math.max(50,parseInt(document.getElementById('plamt')?.value)||PL.amt);
  PL.amt=amt;
  if(!spendCredits(amt)){ sfx.error(); if(PL.autoLeft>0){ PL.autoLeft=0; plinkoAutoBtn(); }
    toast('Fonds insuffisants','Vendez des objets ou contractez un prêt virtuel.','bad'); return; }
  PL.balls.push({x:L.W/2+(Math.random()-0.5)*8,y:18,vx:(Math.random()-0.5)*80,vy:0,r:8,amt,base:stakeBase(amt),done:false});
  PL.lastDrop=performance.now();
  beep(700,.06,'triangle',.05,0,-300);
  if(auto&&PL.autoLeft>0){ PL.autoLeft--; plinkoAutoBtn(); if(PL.autoLeft===0) toast('Auto Drop terminé','Budget de session épuisé.','info'); }
}
function plinkoLand(b,bucket){
  b.done=true;
  const M=PLINKO[PL.mode],mult=M.mults[bucket];
  PL.hist.unshift(mult); PL.hist.length=Math.min(PL.hist.length,14);

  const cv=document.getElementById('plcv');
  if(cv){ const r=cv.getBoundingClientRect();
    burst(r.left+((bucket+0.5)*PL.layout.dx),r.top+PL.layout.yl+30,plinkoColors(mult),mult>=5?60:24,mult>=5?9:6); }
  const rank=plinkoRank(mult,b.base,PL.mode);
  if(!isPrac()){
    S.stats.plinko.drops++;

}

function plinkoDraw(){
  const cv=document.getElementById('plcv'); if(!cv||!PL.layout) return;
  const g=cv.getContext('2d'),L=PL.layout,M=PLINKO[PL.mode];
  const sc=2; g.setTransform(sc,0,0,sc,0,0);
  g.clearRect(0,0,L.W,L.H);
  const bh=44;
  for(let i=0;i<M.mults.length;i++){
    const x=i*L.dx,m=M.mults[i],col=plinkoColors(m);
    const fl=PL.flash&&PL.flash.b===i&&performance.now()-PL.flash.t<800;
    const k=fl?1-(performance.now()-PL.flash.t)/800:0;
    g.fillStyle=fl?`rgba(${hexRGB(col)},${0.35+k*0.45})`:hexA(col,0.28);
    g.fillRect(x+1.5,L.yl+4,L.dx-3,bh);
    g.strokeStyle=col; g.lineWidth=fl?2:1; g.strokeRect(x+1.5,L.yl+4,L.dx-3,bh);
    g.fillStyle=col; g.font='700 11px Chakra Petch'; g.textAlign='center';
    g.fillText(m>=10?'x'+m:'x'+m.toFixed(2).replace(/\.?0+$/,''),x+L.dx/2,L.yl+30);
    if(fl){ g.save(); g.shadowColor=col; g.shadowBlur=22*k; g.strokeRect(x+1.5,L.yl+4,L.dx-3,bh); g.restore(); }
  }
  g.fillStyle='#5c6675';
  for(const p of L.pegs){ g.beginPath(); g.arc(p.x,p.y,6,0,6.28); g.fill(); }
  g.fillStyle='#98a1b1';
  for(const p of L.pegs){ g.beginPath(); g.arc(p.x-1.6,p.y-1.6,1.8,0,6.28); g.fill(); }
  g.strokeStyle='#ff3b30';
  g.beginPath(); g.moveTo(L.W/2-14,6); g.lineTo(L.W/2,18); g.lineTo(L.W/2+14,6); g.stroke();
  for(const b of PL.balls){
    g.save(); g.shadowColor='#ff8c1a'; g.shadowBlur=14;
    g.fillStyle='#ff8c1a'; g.beginPath(); g.arc(b.x,b.y,b.r,0,6.28); g.fill();
    g.restore();
    g.fillStyle='#ffd9a8'; g.beginPath(); g.arc(b.x-2.4,b.y-2.4,2.4,0,6.28); g.fill();
  }
}
